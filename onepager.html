<!DOCTYPE html>

<meta name="viewport" id="vp" content="width=device-width, initial-scale=1">
<script>
  /* ПРИНУДИТЕЛЬНЫЙ VIEWPORT 972 УБРАН 28.08.2026.
     Он вписывал слайд 960px в экран телефона целиком — масштаб выходил 0,39,
     и основной текст листа превращался в 4pt, подписи плиток в 3,5pt. Заодно
     он делал недостижимым собственный @media (max-width:680px) этого же файла:
     ширина 680 не наступала никогда, и телефону показывали совет «включите
     фоновую графику в диалоге печати» — при том что автопечать на телефоне
     намеренно выключена и диалога у него нет.
     Замер Метрики за квартал: 24 человека из 53 открывают лист с телефона.
     Теперь на узком экране лист читается как обычная страница в одну колонку;
     печать на десктопе (@page 10in × 5.625in) не затронута. */
  (function () {
    var dev = Math.min((window.screen && screen.width) || Infinity,
                       window.innerWidth || Infinity);
    document.documentElement.classList.toggle("narrow", dev < 760);
  })();
</script>

<style>
  :root {
    --ivory: #F4F2F0; --card: #FFFFFF;
    --nav: #1B2153; --nav2: #283067; --nav-deep: #0D1026;
    --or: #EE7D1B; --or-text: #B15300; --or-soft: #FBEAD6;
    --ink: #20233F; --hushed: #5A6180; --faint: #666B87;
    --border: #DCDEEC; --line: #EAEBF4;
    --up: #1E7C4F; --down: #C0561A;
    --f: 'Onest', system-ui, sans-serif;
    --m: 'JetBrains Mono', Consolas, monospace;
    --display: 'Rubik', 'Onest', system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color-adjust: exact !important; }
  body { margin: 0; background: #4A4E63; font-family: var(--f); -webkit-font-smoothing: antialiased; }

  .toolbar { position: sticky; top: 0; z-index: 10; background: var(--nav-deep); color: #E7E9F4; display: flex; align-items: center; gap: 14px; padding: 11px 22px; }
  .toolbar a { color: #AEB3D0; text-decoration: none; font-size: 14px; }
  .toolbar a:hover { color: #fff; }
  .themes { display: flex; gap: 6px; }
  .themes a { border: 1px solid #3A4068; border-radius: 6px; padding: 5px 12px; font-size: 12.5px; }
  .themes a.on { background: var(--or); border-color: var(--or); color: #1A1206; font-weight: 600; }
  .toolbar .sp { margin-left: auto; }
  .btn-print { background: var(--or); border: none; color: #1A1206; font-family: var(--f); font-size: 14px; font-weight: 600; padding: 9px 18px; border-radius: 7px; cursor: pointer; }
  .btn-print:hover { background: #F58E33; }

  .slide { position: relative; width: 960px; height: 540px; margin: 18px auto; background: var(--ivory); overflow: hidden; box-shadow: 0 12px 36px rgba(13,16,38,0.5); display: flex; flex-direction: column; }
  /* На экране слайд фикс. 960px. На телефоне вписываем по ширине через viewport
     width=972 (см. inline-скрипт в <head>) — браузер сам масштабирует страницу.
     Печать использует натуральные 960×540 под @page. */
  /* Тулбар прижат вправо: всплывашки Contact открываем влево (right:0), иначе их
     absolute-коробка (даже закрытая) торчит за правый край и даёт горизонтальный
     скролл на телефоне. Share (.sh-menu) уже right:0. */
  .toolbar .ct-menu, .toolbar .ct-toast { left: auto; right: 0; }
  /* На узком экране тулбар переносится, распорка и совет про печать убираются,
     чтобы ряд кнопок не разъезжался за правый край. */


  .brand { display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 600; }
  .qual { font-family: var(--m); font-size: 9px; line-height: 1.55; letter-spacing: 0.02em; text-align: right; }
  .lbl { font-family: var(--m); font-size: 9.5px; letter-spacing: 0.13em; text-transform: uppercase; color: var(--or-text); margin-bottom: 6px; }

  /* ── Слайд 1 — титул (C: navy + оранжевые блоки) ── */
  .t-slide { padding: 34px 52px; justify-content: space-between; background: var(--nav); color: #F3F4FB; }
  .t-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .t-top .brand { color: #F3F4FB; }
  .t-top .qual { color: #9CA1C4; }
  .t-badge { font-family: var(--m); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--or); margin-bottom: 12px; }
  .t-title { font-family: var(--display); font-size: 46px; font-weight: 600; letter-spacing: -0.025em; line-height: 1.08; max-width: 780px; color: #FFFFFF; }
  .t-bar { margin-top: 20px; width: 68px; height: 5px; background: var(--or); }
  .t-meta { font-family: var(--m); font-size: 11px; letter-spacing: 0.04em; color: #9CA1C4; }
  .t-blocks { position: absolute; inset: 0; pointer-events: none; }
  .t-blocks i { position: absolute; background: var(--or); display: block; }

  /* ── Слайд 2 — описание ── */
  .c-head { padding: 20px 52px 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; }
  .c-title { font-family: var(--display); font-size: 23px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.12; color: var(--ink); }
  .c-badge { display: inline-block; margin-top: 8px; font-family: var(--m); font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--nav); background: #E4E6F2; border-radius: 5px; padding: 3px 9px; }
  .c-sub { margin-top: 9px; font-size: 11.5px; line-height: 1.45; color: var(--hushed); max-width: 440px; }

  /* Корзина worst-of: на что клиент берёт риск — видно до чтения текста.
     Тикеры крупно (опознаются быстрее названий), названия — подписью под ними. */
  .basket { margin-top: 11px; display: flex; align-items: center; gap: 9px; }
  .bk-lbl { flex: none; font-family: var(--m); font-size: 8.5px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--or-text); background: var(--or-soft); border-radius: 4px; padding: 5px 7px; line-height: 1.15; max-width: 92px; }
  .bk-row { display: flex; gap: 6px; }
  .bk-chip { display: flex; flex-direction: column; align-items: center; background: var(--card);
    border: 1px solid var(--or); border-radius: 7px; padding: 4px 10px 5px; }
  .bk-chip b { font-family: var(--display); font-size: 17px; font-weight: 700; line-height: 1.05;
    letter-spacing: -0.01em; color: var(--nav); }
  .bk-chip i { font-style: normal; font-size: 8px; color: var(--faint); margin-top: 1px; white-space: nowrap; }
  /* Титульный слайд тёмный — плашка и чипы инвертируются */
  .t-slide .basket { margin-top: 20px; }
  .t-slide .bk-lbl { color: #FFD9B0; background: rgba(238,125,27,0.18); }
  .t-slide .bk-chip { background: rgba(255,255,255,0.07); border-color: rgba(238,125,27,0.55); }
  .t-slide .bk-chip b { color: #FFFFFF; font-size: 21px; }
  .t-slide .bk-chip i { color: rgba(243,244,251,0.62); font-size: 8.5px; }
  .c-quote { text-align: right; flex: none; }
  .c-quote .v { font-family: var(--m); font-size: 26px; font-weight: 600; letter-spacing: -0.02em; color: var(--nav); }
  .c-quote .v .q-dec { font-size: 0.62em; }
  .c-quote .k { font-size: 9.5px; color: var(--faint); margin-top: 2px; }

  .c-body { flex: 1; min-height: 0; padding: 14px 52px 0; display: flex; }
  .c-row { flex: 1; display: grid; grid-template-columns: 1fr 1.02fr; gap: 22px; }
  .col { display: flex; flex-direction: column; min-height: 0; }
  .col.between { justify-content: space-between; gap: 14px; }

  .expl { font-size: 10.5px; line-height: 1.55; color: var(--hushed); }
  .callout { background: var(--nav); border-radius: 10px; padding: 14px 16px; }
  .callout .lbl { color: #E7A867; }
  .callout .expl { color: #D2D6EC; }
  .callout .expl b { color: #fff; font-weight: 600; }
  .under { margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.16); }
  /* Описание базового актива берётся из справочника и бывает длинным (например,
     ОФЗ 26238) — на слайде фикс. высоты 540px оно распирало колонку, и плитки
     параметров наезжали на дисклеймер. Ограничиваем по строкам. */
  .under .expl { color: #E4E7F4; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 5; overflow: hidden; }

  .params { display: grid; gap: 8px; }
  .params.c2 { grid-template-columns: 1fr 1fr; }
  .params.c4 { grid-template-columns: repeat(4, 1fr); }
  .param { background: var(--card); border: 1px solid var(--border); border-radius: 7px; padding: 7px 11px; }
  .param .v { font-family: var(--m); font-size: 14px; font-weight: 500; color: var(--ink); }
  .param .v.or { color: var(--or-text); }
  .param .k { font-size: 9px; color: var(--faint); margin-top: 2px; }

  .chart-box { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 9px 13px 7px; }
  /* Имя класса НЕ .ct: так называется обёртка кнопки «Обсудить продукт» в
     contact.js, а он объявляет @media print { .ct { display:none !important } }.
     Из-за совпадения заголовок «Диаграмма выплат» пропадал с КАЖДОГО печатного
     листа, а на экране считался как inline-flex вместо блока. */
  .chart-box .chart-t { display: block; font-size: 11px; font-weight: 600; color: var(--nav); margin-bottom: 3px; }
  .chart-cap { margin-top: 5px; font-size: 9px; line-height: 1.4; color: var(--faint); }

  .example .lbl { margin-bottom: 6px; }
  .ex-intro { font-size: 10px; color: var(--hushed); margin-bottom: 6px; }
  .scen { display: grid; gap: 6px; }
  .scen.c1 { grid-template-columns: 1fr; }
  .scen.c2 { grid-template-columns: 1fr 1fr; }
  .scard { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; background: var(--card); border: 1px solid var(--border); border-radius: 7px; padding: 8px 12px; }
  .scard .st { font-size: 10.5px; font-weight: 600; color: var(--ink); }
  .scard .sd { font-size: 9px; color: var(--faint); margin-top: 1px; }
  .scard .sr { font-family: var(--m); font-size: 11.5px; font-weight: 600; white-space: nowrap; }
  /* Процент на вложенные в этом сценарии. НЕ «годовых»: правило витрины про
     доходность-метрику остаётся, здесь — арифметика конкретного примера,
     добавлена по решению Руслана 29.08.2026 */
  .srw { text-align: right; flex: none; }
  .scard .sr-sub { font-family: var(--m); font-size: 9px; color: var(--faint); margin-top: 1px; white-space: nowrap; }
  .fx-inline { margin-top: 8px; padding: 7px 11px; border-left: 3px solid var(--or); background: var(--or-soft); border-radius: 0 6px 6px 0; font-size: 9.5px; line-height: 1.4; font-weight: 500; color: #7A4A12; }

  .c-foot { padding: 12px 52px 16px; font-size: 9.5px; line-height: 1.5; color: var(--faint); }
  /* Слайд с корзиной worst-of: шапка выше на 40px из-за чипов бумаг, и обе
     колонки наезжали на сноску (у автоколлов — с обрезкой строки про валютный
     риск). Возвращаем высоту уплотнением, а не удалением содержимого. */
  .slide.basketed .bk-row { margin-top: 6px; }
  .slide.basketed .bk-chip { padding: 2px 7px 3px; }
  .slide.basketed .c-body { padding-top: 8px; }
  .slide.basketed .scard { padding: 7px 12px; }
  .slide.basketed .ex-intro { margin-bottom: 6px; }
  /* Плитки барьеров у автоколла — в два столбца: четыре в столбик не влезали
     над сноской (−11px даже после всех уплотнений), а значения короткие */
  .slide.basketed .params { gap: 6px; grid-template-columns: 1fr 1fr; }
  .slide.basketed .c-foot { padding: 7px 52px 10px; }
  .slide.basketed .c-body p { line-height: 1.42; margin-bottom: 6px; }
  .slide.basketed .c-head { padding-top: 10px; }
  .slide.basketed .c-sub { margin-top: 6px; }
  .slide.basketed .param { padding: 5px 10px; }

  /* Вторая ступень ужимания переполненного листа — см. fitSlides(). Включается
     только когда набора basketed не хватило (лист с корзиной в шапке и длинным
     разбором). Режем интерлиньяж и отступы; кегль прозы НЕ трогаем — 10,5px на
     печати уже нижняя граница читаемости. */
  .slide.tighter .callout { padding: 10px 13px; }
  .slide.tighter .expl { line-height: 1.4; }
  .slide.tighter .params { gap: 5px; }
  .slide.tighter .param { padding: 4px 9px; }
  .slide.tighter .scard { padding: 5px 10px; }
  .slide.tighter .chart-box { padding: 6px 11px 5px; }
  .slide.tighter .ex-intro { margin-bottom: 4px; }

  /* ── Слайд 3 — дисклеймер (navy) ── */
  .d-slide { padding: 34px 52px; background: var(--nav); color: #E7E9F4; }
  .d-title { font-family: var(--display); font-size: 25px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 4px; }
  .d-bar { width: 56px; height: 4px; background: var(--or); margin-bottom: 18px; }
  .d-body { flex: 1; column-count: 2; column-gap: 34px; }
  .d-body p { margin: 0 0 11px; font-size: 10.2px; line-height: 1.6; break-inside: avoid; color: rgba(231,233,244,0.86); }
  .d-meta { font-family: var(--m); font-size: 9px; color: #9CA1C4; }
  /* Плашка подмены параметров. На листе, а не в панели: панель в печать не идёт,
     а подделанный PDF пересылают дальше именно напечатанным. */
  .c-over { margin-top: 8px; padding: 7px 10px; border-left: 3px solid #B4341C;
    background: #FDEEEA; color: #8E2A15; font-family: var(--m); font-size: 11px;
    line-height: 1.45; border-radius: 0 4px 4px 0; }
  /* Подвал печатного листа: единственное место, где на бумаге есть имя компании
     и обратный адрес. Кегль 11px — пол, установленный проектом; ниже не опускаем
     именно здесь, потому что это то, по чему клиент нас найдёт. */
  .sheet-foot { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
    margin-top: 14px; padding-top: 11px; border-top: 1px solid rgba(255,255,255,0.18); }
  .sheet-foot .sf-b { font-family: var(--display); font-size: 13px; font-weight: 600;
    letter-spacing: 0.02em; color: #FFF; }
  .sheet-foot .sf-s { font-family: var(--m); font-size: 11px; color: #B9BDD8; }
  .sheet-foot .sf-s b { color: var(--or); font-weight: 400; }

  /* Экран «продукта нет»: снят с витрины, битая или устаревшая ссылка */
  .gone-slide { align-items: center; justify-content: center; text-align: center; padding: 0 96px; }
  .gone-slide .g-k { font-family: var(--m); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--or-text); }
  .gone-slide h1 { margin: 14px 0 0; font-family: var(--display); font-size: 34px; font-weight: 600; letter-spacing: -0.02em; color: var(--ink); }
  .gone-slide p { margin: 16px 0 0; font-size: 14px; line-height: 1.6; color: var(--hushed); }
  .gone-slide .g-act { margin-top: 26px; display: flex; gap: 12px; justify-content: center; }
  .gone-slide .g-act a { font-size: 13.5px; font-weight: 600; text-decoration: none; border-radius: 7px; padding: 10px 18px; background: var(--or); color: #1A1206; }
  .gone-slide .g-act a.alt { background: transparent; border: 1px solid #CFD2E4; color: var(--nav); }

  @media print {
    @page { size: 10in 5.625in; margin: 0; }
    body { background: #fff; }
    .toolbar { display: none !important; }
    .slide { margin: 0; box-shadow: none; page-break-after: always; }
    .slide:last-child { page-break-after: auto; }
  }
  /* Телефон. Раньше этот блок был мёртвым: инлайн-скрипт в <head> гарантировал
     ширину 972px, и 680 не наступало никогда. Теперь работает — и делает главное:
     снимает со слайда жёсткие 960×540, из-за которых лист на телефоне был
     нечитаемым эскизом. Печать этот блок не трогает: он screen-only. */
  @media screen and (max-width: 760px) {
    .toolbar { flex-wrap: wrap; gap: 8px 10px; padding: 10px 14px; }
    .toolbar .sp { display: none; }
    .toolbar .tb-hint { display: none; }   /* диалога печати на телефоне нет */
    .toolbar a, .toolbar button { min-height: 44px; }
    body { overflow-x: hidden; }
    #deck { padding: 0 14px 28px; }
    .slide {
      width: auto; min-width: 0; max-width: 100%;
      height: auto; min-height: 0;
      overflow: visible;            /* иначе низ листа ампутируется, как было */
      padding: 22px 18px 26px;
      margin: 0 0 14px;
    }
    /* Кегль на телефоне поднимаем до читаемого: печатные 9–10,5px были
       рассчитаны на лист 960px, а не на экран 375px */
    .slide { font-size: 15px; line-height: 1.55; }
    /* .c-head — флекс «заголовок + крупная котировка справа»; на телефоне
       котировка уезжала за экран на 245px, а корзина bk-row — на 142 */
    /* Боковые отступы 52px и колонки 44px считались под лист 960px — на 375
       они съедают экран и выталкивают котировку за край на 245px */
    .c-head, .c-body, .c-foot, .t-top, .t-blocks, .d-body { padding-left: 0; padding-right: 0; }
    .c-head { display: block; }
    .c-quote { margin-top: 14px; text-align: left; }
    .bk-row { flex-wrap: wrap; }
    /* .c-row — двухколоночный ряд слайда; без него колонки остаются рядом
       и ряд уезжает за экран на 53px (замер на 375) */
    .c-body, .c-row, .col, .col.between { display: block; }
    .c-row > * { width: auto !important; max-width: 100%; }
    #deck svg { max-width: 100%; height: auto; }
    .params { grid-template-columns: 1fr 1fr; }
    .t-blocks { display: none; }    /* декоративные прямоугольники титула */
    .d-body { column-count: 1; }
    .d-body p, .c-foot, .qual, .chart-cap { font-size: 12px; line-height: 1.5; }
    .param .k, .lbl, .c-badge, .scard .sd, .scard .sr-sub { font-size: 11px; }
    .t-title { font-size: 26px; } .c-title { font-size: 20px; } .d-title { font-size: 20px; }
    .sheet-foot .sf-s { font-size: 12px; }
  }

</style>

</div>

<div id="deck"></div>

<script src="data/instruments.js?v=fx8"></script>
<script src="data/lib.js?v=ax5"></script>
<script src="data/offerings.js?v=srv19"></script>
<script src="share.js?v=8"></script>
<script src="contact.js?v=9"></script>
<script>
  const S = window.SITE;
  // Метка сейлза для подвала листа: её кладёт metrika.js, когда агент входит
  // по своей ссылке. Формат тот же, что на витрине — [\w.-] до 40 знаков.
  function refTag() {
    try {
      const v = localStorage.getItem("so_ref");
      return v && /^[\w.-]{1,40}$/.test(v) ? v : "";
    } catch (e) { return ""; }
  }
  // «+130% на вложенные» / «−38% на вложенные» — процент результата сценария
  // к деньгам, которые реально заплачены (премия у варранта, цена у дисконтной)
  function roiTxt(net, invested) {
    if (!invested) return "";
    const r = Math.round(net / invested * 100);
    if (!isFinite(r)) return "";
    return (r >= 0 ? "+" : "−") + Math.abs(r) + "% на вложенные";
  }
  function esc(v) {
    return String(v == null ? "" : v).replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  const qs = new URLSearchParams(location.search);

  // Параметры листа можно переопределить адресом (?part / ?protect / ?cap) —
  // это удобство деска для расчёта под клиента. Но без пометки получался
  // официальный лист с настоящим названием продукта и придуманными условиями:
  // ?id=P-MU-CS-0828&part=300&protect=100&cap=0 печатал «300% этого роста,
  // без ограничения сверху» под заголовком «Защита капитала · MU · до +50%».
  // Документ выглядел как обычный и пересылался дальше. Теперь на самом листе
  // (не в панели — она в печать не идёт) стоит явная плашка.
  const OVERRIDDEN = [];

  // Режим размещения: ?offering=<id> строит one-pager из data/offerings.js (напр. структурная CLN).
  const OFF = window.OFFERINGS;
  const offId = qs.get("offering");
  const offRaw = (offId && OFF && OFF.items) ? OFF.items.find(o => o.id === offId) : null;

  // МАРШРУТ РАЗМЕЩЕНИЙ ЗАКРЫТ 28.08.2026 — решение Руслана после разбора.
  // Шаблон выбирался по полю opTemplate, которого нет НИ У ОДНОГО размещения
  // в data/offerings.js. Управление уходило в ветку кредитной ноты, и варрант
  // CALL на юань (sp-1-45-cb-fx-rub, ISIN RU000A10BZ44) печатался так:
  //   «погашается по 100% номинала», «ГЛАВНЫЙ РИСК · КРЕДИТНОЕ СОБЫТИЕ.
  //    Кредитный риск на контрольное лицо — CNYRUB», «+842 500 ₽».
  // Валюта названа лицом, которое может обанкротиться; варранту обещан возврат
  // номинала, которого у него нет. Тизер на том же листе говорил правду:
  // «потеря всей суммы вложений». Второе размещение (energy-future) вообще
  // роняло страницу в белый экран: нет поля price, fmt2(undefined) бросает.
  // Из интерфейса ссылка недостижима (кнопка на offerings.html тоже завязана на
  // opTemplate), но адрес живой и пересылается. До появления настоящего шаблона
  // печатаем честную заглушку, а не неверный лист: напечатанная ложь дороже
  // отсутствующего документа.
  const offBroken = offRaw && !offRaw.opTemplate;
  const offering = offBroken ? null : offRaw;

  // Продукта с таким id нет (снят с витрины, битая ссылка, пустой ?id) — печатаем
  // экран-заглушку вместо чужого продукта: findInstrument теперь возвращает null.
  const found = offering ? null : S.findInstrument(qs.get("id"));
  if (!offering && !found) {
    document.title = offBroken
      ? "One-pager для размещения пока не собирается — Rumberg"
      : "Продукт снят с витрины — Rumberg";
    document.getElementById("deck").innerHTML =
      '<section class="slide gone-slide">' +
        (offBroken
          ? '<div class="g-k">лист ещё не готов</div>' +
            '<h1>Для этого размещения печатного листа пока нет</h1>' +
            '<p>Параметры выпуска, условия и документы — на странице размещения. ' +
            'Печатный лист для размещений мы соберём отдельно: показывать его ' +
            'по чужому шаблону нельзя, цифры вышли бы неверными.</p>' +
            '<div class="g-act">' +
              '<a href="offerings.html#' + esc(offId || "") + '">Открыть размещение</a>' +
              '<a class="alt" href="https://t.me/Rumberb_Sales_Team_bot" target="_blank" rel="noopener">Написать в Telegram</a>' +
            '</div>'
          : '<div class="g-k">ссылка устарела</div>' +
            '<h1>Продукт снят с витрины</h1>' +
            '<p>Этого продукта больше нет в каталоге: условия могли измениться, а выпуск — уже разместиться. ' +
            'Актуальные инструменты с котировками собраны на доске.</p>' +
            '<div class="g-act">' +
              '<a href="board.html">Открыть доску</a>' +
              '<a class="alt" href="https://t.me/Rumberb_Sales_Team_bot" target="_blank" rel="noopener">Написать в Telegram</a>' +
            '</div>') +
      '</section>';
    const bl = document.getElementById("back-link");
    if (offBroken) { bl.href = "offerings.html"; bl.textContent = "← К размещениям"; }
    else { bl.href = "board.html"; bl.textContent = "← К доске"; }
    // Кнопка печати на экране-заглушке напечатала бы саму заглушку
    const pb = document.querySelector(".btn-print"); if (pb) pb.style.display = "none";
  } else {
  let inst, nom, q, name, backHref, backText, isForeign;
  if (offering) {
    q = offering.price; nom = 1000000; name = offering.name;
    if (offering.opTemplate === "warrant") {
      // Offering-варрант (напр. CALL ATM на CNY/RUB): синтезируем warrant-inst и
      // рендерим стандартный one-pager варранта, а не CLN-ветку. Страйк ATM = 100%.
      inst = { type: "warrant", structure: "call", underlying: offering.opUnderlying || offering.reference, strike: 100, strike2: null, spot: 100, tenor: offering.tenor };
    } else {
      inst = { type: "offering", underlying: offering.reference, expiry: offering.maturity };
    }
    isForeign = false;
    backHref = "offerings.html"; backText = "← К размещению";
  } else {
    inst = found;
    nom = inst.minNom; q = inst.quote; name = S.displayName(inst);
    isForeign = S.isFxSensitive(inst.underlying);
    backHref = "board.html#" + encodeURIComponent(inst.id); backText = "← К инструменту";
  }
  const U = S.underlyingInfo(inst.underlying);

  // Worst-of: продукт на корзину. Шаблон one-pager остаётся стандартным — просто
  // вместо одного актива подставляется ХУДШАЯ бумага корзины, а сам перечень бумаг
  // уходит в блок «О корзине». Формулировки слово в слово как на доске и в карточке.
  const isWO = Array.isArray(inst.basket) && inst.basket.length > 1;
  const uName = isWO ? "худшей бумаги корзины" : inst.underlying;
  const uGrew = isWO ? "Худшая бумага корзины выросла" : inst.underlying + " вырос";
  const uFell = isWO ? "Худшая бумага корзины упала" : inst.underlying + " упал";
  const uNo = isWO ? "Худшая бумага корзины не выросла" : inst.underlying + " не вырос";
  const uGrewLow = isWO ? "худшая бумага корзины выросла" : inst.underlying + " вырос";
  const uGenAsset = isWO ? "худшей бумаги корзины" : "базового актива";
  const uAxis = isWO ? "уровень худшей бумаги" : "уровень БА";
  const uPoss = isWO ? "её" : "его";
  const woLabel = isWO ? "О корзине · " + inst.underlying : null;
  const woDesc = isWO
    ? "Корзина из " + inst.basket.length + " бумаг: " + inst.underlying +
      ". Все условия считаются по ХУДШЕЙ из них: результат определяет самая слабая бумага корзины, а не средняя по ней. " +
      "Именно за этот риск цена входа ниже, чем у продукта на одну бумагу."
    : null;
  const fxShort = "Расчёт в валюте базового актива — изменение курса рубля к ней не учтено.";

  document.title = "One-pager — " + name;
  { const bl = document.getElementById("back-link"); bl.href = backHref; bl.textContent = backText; }

  const today = new Date();
  const dateS = ("0" + today.getDate()).slice(-2) + "." + ("0" + (today.getMonth() + 1)).slice(-2) + "." + today.getFullYear();
  const starSvg = (s, f) => '<svg width="' + s + '" height="' + s + '" viewBox="0 0 26 26" fill="none"><path d="M13 1 L15.6 10.4 L25 13 L15.6 15.6 L13 25 L10.4 15.6 L1 13 L10.4 10.4 Z" fill="' + f + '"/></svg>';
  const QUAL = "Только для квалифицированных инвесторов<br>Не является индивидуальной инвестиционной рекомендацией";

  function underDesc() {
    return S.underlyingLong(inst.underlying) || (U && U.desc) ||
      (inst.underlying + " — базовый актив, от динамики которого зависит выплата по продукту.");
  }

  // ── Диаграммы выплат ──
  const CW = 420, CH = 124, PAD = 16;
  const MONO = 'font-family="JetBrains Mono, monospace"';
  // Подписи графика — ЧИТАЕМЫЙ оранжевый (--or-text, 4,58:1 на белом), а не
  // фирменный #EE7D1B: он на белом даёт 2,77:1 при кегле 9,4px, и этим цветом
  // набраны самые важные числа листа — премия, безубыток, участие, потолок.
  // Всего 161 такая подпись по каталогу. Кнопочный оранжевый остаётся #EE7D1B:
  // там по нему идёт тёмный текст и контраст в порядке.
  // lab тоже поднят: #8B90A8 давал 3,16:1 у «падение 1:1» и «по перформансу».
  const C = { line: "#1B2153", or: "#B15300", grid: "#E4E5F0", axis: "#CFD2E4", lab: "#6B7188", lab2: "#5A6180" };

  function chWarrant() {
    const K = inst.strike, K2 = inst.strike2;
    const cap = K2 ? (K2 - K) : 0;
    const sBe = K + q, s0 = K * 0.8;
    // Правый край: у простого колла тянем до 1,25 безубытка, иначе точка сценария
    // (она считается от премии) уезжала за пределы графика у дорогих опционов.
    const s1 = K2 ? K2 * 1.18 : Math.max(K * 1.32, sBe * 1.25);
    const yMax = K2 ? cap + 10 : Math.max(34, S.PAYOFF.pct(s1, K) + 6);
    const x = s => PAD + ((s - s0) / (s1 - s0)) * (CW - PAD * 2);
    const y = v => CH - PAD - (v / yMax) * (CH - PAD * 2);
    let line = "M" + x(s0).toFixed(1) + " " + y(0).toFixed(1) + " L" + x(K).toFixed(1) + " " + y(0).toFixed(1);
    if (K2) line += " L" + x(K2).toFixed(1) + " " + y(cap).toFixed(1) + " L" + x(s1).toFixed(1) + " " + y(cap).toFixed(1);
    else line += " L" + x(s1).toFixed(1) + " " + y(S.PAYOFF.pct(s1, K)).toFixed(1);
    let capMark = "";
    if (K2) capMark = '<line x1="' + PAD + '" y1="' + y(cap) + '" x2="' + (CW - PAD) + '" y2="' + y(cap) + '" stroke="' + C.grid + '" stroke-width="1" stroke-dasharray="2 4"/>' +
      '<rect x="' + (x(K2) - 4) + '" y="' + (y(cap) - 4) + '" width="8" height="8" transform="rotate(45 ' + x(K2) + ' ' + y(cap) + ')" fill="' + C.line + '"/>' +
      '<text x="' + x(K2) + '" y="' + (y(cap) - 8) + '" text-anchor="middle" fill="' + C.lab2 + '" font-size="10" ' + MONO + '>K₂ ' + S.fmtSmart(K2) + ' · макс. ' + S.fmtSmart(cap) + '%</text>';
    // Простой колл: потолка нет — линия уходит вверх со стрелкой на конце + подпись
    const pathMarker = K2 ? "" : ' marker-end="url(#up-arrow)"';
    const upMark = K2 ? "" :
      '<text x="' + (CW - PAD) + '" y="11" text-anchor="end" fill="' + C.line + '" font-size="10" ' + MONO + '>рост не ограничен</text>';
    const beEnd = x(sBe) > CW * 0.72;
    return '<svg viewBox="0 0 ' + CW + ' ' + CH + '" width="100%" style="display:block">' +
      '<defs><marker id="up-arrow" markerWidth="11" markerHeight="10" refX="1.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="' + C.line + '"/></marker></defs>' +
      '<line x1="' + PAD + '" y1="' + y(0) + '" x2="' + (CW - PAD) + '" y2="' + y(0) + '" stroke="' + C.grid + '" stroke-width="1"/>' +
      '<line x1="' + PAD + '" y1="' + y(q) + '" x2="' + (CW - PAD) + '" y2="' + y(q) + '" stroke="' + C.or + '" stroke-width="1" stroke-dasharray="4 4"/>' +
      '<text x="' + (PAD + 2) + '" y="' + (y(q) - 5) + '" fill="' + C.or + '" font-size="10" ' + MONO + '>премия ' + S.fmt1(q) + '%</text>' + capMark +
      '<path d="' + line + '" fill="none" stroke="' + C.line + '" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"' + pathMarker + '/>' + upMark +
      '<rect x="' + (x(K) - 4) + '" y="' + (y(0) - 4) + '" width="8" height="8" transform="rotate(45 ' + x(K) + ' ' + y(0) + ')" fill="' + C.line + '"/>' +
      '<text x="' + x(K) + '" y="' + (y(0) + 15) + '" text-anchor="middle" fill="' + C.lab2 + '" font-size="10" ' + MONO + '>K ' + S.fmtSmart(K) + '</text>' +
      '<circle cx="' + x(sBe) + '" cy="' + y(q) + '" r="4" fill="' + C.or + '"/>' +
      '<text x="' + (x(sBe) + (beEnd ? -7 : 7)) + '" y="' + (y(q) + 14) + '"' + (beEnd ? ' text-anchor="end"' : '') + ' fill="' + C.or + '" font-size="10" ' + MONO + '>б/у ' + S.fmtSmart(sBe) + '</text>' +
      '</svg>';
  }
  function chDiscount() {
    const base = CH - 34, pxPer = (CH - 74) / 110, barW = 78;
    const x1 = CW * 0.31 - barW / 2, x2 = CW * 0.69 - barW / 2;
    const h1 = q * pxPer, h2 = 100 * pxPer;
    return '<svg viewBox="0 0 ' + CW + ' ' + CH + '" width="100%" style="display:block">' +
      '<line x1="' + PAD + '" y1="' + base + '" x2="' + (CW - PAD) + '" y2="' + base + '" stroke="' + C.axis + '" stroke-width="1"/>' +
      '<line x1="' + (x1 + barW / 2) + '" y1="' + (base - h1) + '" x2="' + (x2 + barW) + '" y2="' + (base - h1) + '" stroke="' + C.or + '" stroke-width="1" stroke-dasharray="4 4"/>' +
      '<rect x="' + x1 + '" y="' + (base - h1) + '" width="' + barW + '" height="' + h1 + '" rx="6" fill="#C6C9DE"/>' +
      '<rect x="' + x2 + '" y="' + (base - h2) + '" width="' + barW + '" height="' + h2 + '" rx="6" fill="' + C.line + '"/>' +
      '<text x="' + (x1 + barW / 2) + '" y="' + (base - h1 - 7) + '" text-anchor="middle" fill="' + C.lab2 + '" font-size="12" ' + MONO + '>' + S.fmt2(q) + '%</text>' +
      '<text x="' + (x2 + barW / 2) + '" y="' + (base - h2 - 7) + '" text-anchor="middle" fill="' + C.line + '" font-size="12" ' + MONO + '>100%</text>' +
      '<text x="' + ((x1 + barW + x2) / 2) + '" y="' + (base - h1 - 6) + '" text-anchor="middle" fill="' + C.or + '" font-size="10" ' + MONO + '>+' + S.fmt2(100 - q) + ' п.п.</text>' +
      '<text x="' + (x1 + barW / 2) + '" y="' + (base + 15) + '" text-anchor="middle" fill="' + C.lab2 + '" font-size="10">Покупка</text>' +
      '<text x="' + (x2 + barW / 2) + '" y="' + (base + 15) + '" text-anchor="middle" fill="' + C.lab2 + '" font-size="10">Погашение</text>' +
      '</svg>';
  }
  function chProtection(cfg) {
    const part = cfg.part, floor = cfg.floor, cap = cfg.cap, K = cfg.strike || 100;   // part 0..1; floor %; cap = макс. рост БА, %; K — страйк опциона (% от начального уровня)
    // Модель выплаты — ОБЩАЯ с витриной (S.calc.pct): база = уровень защиты, участие
    // начисляется на рост выше страйка, ниже страйка — полка. Свой расчёт здесь
    // расходился с сайтом при защите ниже 100% (платил 100% на любом падении).
    const cfgP = { type: "protection", participation: part, protectionPct: floor, strike: K, cap: cap };
    const pay = up => S.calc.pct(cfgP, up);
    const capPay = cap != null ? pay(cap) : null;
    // При потолке кадр обязан доходить ЗА него, иначе полка не рисуется: при
    // cap = 50 и фиксированном upMax = 40 линия обрывалась на +40%, не дойдя до
    // потолка, и точка перелома в график не попадала вовсе
    const upMin = -30, upMax = cap != null ? Math.ceil(cap / 5) * 5 + 10 : 40;
    const x = up => PAD + ((up - upMin) / (upMax - upMin)) * (CW - PAD * 2);
    const yLo = Math.min(floor, 100), yHi = Math.max(pay(upMax), 100), span = Math.max(yHi - yLo, 1);
    const yMin = yLo - span * 0.16, yMax = yHi + span * 0.20;
    const y = v => CH - PAD - ((v - yMin) / (yMax - yMin)) * (CH - PAD * 2);
    const upKink = K - 100;                 // здесь полка защиты переходит в участие
    let bps = [upMin, 0, upMax];
    if (upKink > upMin && upKink < upMax) bps.push(upKink);
    if (cap != null && cap > 0 && cap < upMax) bps.push(cap);
    bps = Array.from(new Set(bps)).sort((a, b) => a - b);
    const line = "M" + bps.map(u => x(u).toFixed(1) + " " + y(pay(u)).toFixed(1)).join(" L");
    const uncapped = cap == null;
    const midUp = (0 + (cap != null ? cap : upMax * 0.85)) / 2;
    let svg = '<svg viewBox="0 0 ' + CW + ' ' + CH + '" width="100%" style="display:block">';
    if (uncapped) svg += '<defs><marker id="up-arr" markerWidth="11" markerHeight="10" refX="1.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="' + C.line + '"/></marker></defs>';
    svg += '<line x1="' + PAD + '" y1="' + y(floor) + '" x2="' + (CW - PAD) + '" y2="' + y(floor) + '" stroke="' + C.axis + '" stroke-width="1" stroke-dasharray="4 4"/>' +
      '<text x="' + (PAD + 2) + '" y="' + (y(floor) - 6) + '" fill="' + C.lab2 + '" font-size="10" ' + MONO + '>' + (floor >= 100 ? 'защита 100%' : 'мин. ' + S.fmtSmart(floor) + '%') + '</text>';
    if (cap != null) svg += '<line x1="' + PAD + '" y1="' + y(capPay) + '" x2="' + (CW - PAD) + '" y2="' + y(capPay) + '" stroke="' + C.axis + '" stroke-width="1" stroke-dasharray="2 4"/>' +
      '<text x="' + (PAD + 2) + '" y="' + (y(capPay) - 5) + '" fill="' + C.lab2 + '" font-size="10" ' + MONO + '>потолок ' + S.fmtSmart(capPay) + '%</text>' +
      '<rect x="' + (x(cap) - 4) + '" y="' + (y(capPay) - 4) + '" width="8" height="8" transform="rotate(45 ' + x(cap) + ' ' + y(capPay) + ')" fill="' + C.line + '"/>';
    svg += '<path d="' + line + '" fill="none" stroke="' + C.line + '" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"' + (uncapped ? ' marker-end="url(#up-arr)"' : '') + '/>';
    if (uncapped) svg += '<text x="' + (CW - PAD) + '" y="11" text-anchor="end" fill="' + C.line + '" font-size="10" ' + MONO + '>рост не ограничен</text>';
    svg += '<rect x="' + (x(0) - 4) + '" y="' + (y(pay(0)) - 4) + '" width="8" height="8" transform="rotate(45 ' + x(0) + ' ' + y(pay(0)) + ')" fill="' + C.line + '"/>' +
      '<text x="' + x(0) + '" y="' + (y(pay(0)) + 15) + '" text-anchor="middle" fill="' + C.lab2 + '" font-size="10" ' + MONO + '>S₀</text>';
    if (upKink > upMin && upKink < upMax && upKink !== 0) svg += '<rect x="' + (x(upKink) - 3.5) + '" y="' + (y(floor) - 3.5) + '" width="7" height="7" transform="rotate(45 ' + x(upKink) + ' ' + y(floor) + ')" fill="#C0561A"/>';
    // Отступ подписи считаем от САМОЙ ВЫСОКОЙ точки линии под её рамкой, а не от
    // середины: линия наклонная, и фиксированные 9px она прорезала насквозь
    // (та же правка, что в payoffChart для витрины)
    const upLab = 'участие ' + Math.round(part * 100) + '%';
    const upHalf = (upLab.length * 10 * 0.62 / 2 + 5) / ((CW - PAD * 2) / (upMax - upMin));
    let upTop = Infinity;
    for (let i = 0; i <= 10; i++) upTop = Math.min(upTop, y(pay(midUp - upHalf + 2 * upHalf * i / 10)));
    svg += '<text x="' + x(midUp) + '" y="' + (upTop - 9) + '" text-anchor="middle" fill="' + C.or + '" font-size="10" ' + MONO + '>' + upLab + '</text>';
    return svg + '</svg>';
  }

  function chBooster() {
    const K = inst.strike || 100, K2 = inst.strike2 || 110, ku = (inst.ku || 175) / 100;
    const capPay = K + ku * (K2 - K);
    const pay = up => { const s = 100 + up; return s < K ? s : K + ku * (Math.min(s, K2) - K); };
    const upMin = -30, upMax = 22;
    const x = up => PAD + ((up - upMin) / (upMax - upMin)) * (CW - PAD * 2);
    const yLo = pay(upMin), span = Math.max(capPay - yLo, 1);
    const yMin = yLo - span * 0.14, yMax = capPay + span * 0.20;
    const y = v => CH - PAD - ((v - yMin) / (yMax - yMin)) * (CH - PAD * 2);
    const bps = [upMin, 0, K2 - 100, upMax];
    const line = "M" + bps.map(u => x(u).toFixed(1) + " " + y(pay(u)).toFixed(1)).join(" L");
    let svg = '<svg viewBox="0 0 ' + CW + ' ' + CH + '" width="100%" style="display:block">' +
      '<line x1="' + PAD + '" y1="' + y(100) + '" x2="' + (CW - PAD) + '" y2="' + y(100) + '" stroke="' + C.axis + '" stroke-width="1" stroke-dasharray="4 4"/>' +
      '<text x="' + (CW - PAD) + '" y="' + (y(100) + 13) + '" text-anchor="end" fill="' + C.lab2 + '" font-size="10" ' + MONO + '>номинал 100%</text>' +
      '<line x1="' + PAD + '" y1="' + y(capPay) + '" x2="' + (CW - PAD) + '" y2="' + y(capPay) + '" stroke="' + C.axis + '" stroke-width="1" stroke-dasharray="2 4"/>' +
      '<text x="' + (CW - PAD) + '" y="' + (y(capPay) - 5) + '" text-anchor="end" fill="' + C.or + '" font-size="10" ' + MONO + '>потолок +' + S.fmt1(capPay - 100) + '%</text>' +
      '<path d="' + line + '" fill="none" stroke="' + C.line + '" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<rect x="' + (x(0) - 4) + '" y="' + (y(100) - 4) + '" width="8" height="8" transform="rotate(45 ' + x(0) + ' ' + y(100) + ')" fill="' + C.line + '"/>' +
      '<text x="' + x(0) + '" y="' + (y(100) + 14) + '" text-anchor="middle" fill="' + C.lab2 + '" font-size="10" ' + MONO + '>S₀</text>' +
      '<text x="' + x(-18) + '" y="' + (y(pay(-18)) - 8) + '" text-anchor="middle" fill="' + C.lab + '" font-size="10" ' + MONO + '>падение 1:1</text>' +
      '<text x="' + x((K2 - 100) + 3) + '" y="' + (y(capPay) + 13) + '" fill="' + C.or + '" font-size="10" ' + MONO + '>×' + Math.round(ku * 100) + '%</text>';
    return svg + '</svg>';
  }

  // Реверс-конвертибл: ПОЛНАЯ выплата за срок — тело плюс купоны. Тело отдельной
  // пунктирной линией, зазор между линиями и есть купон. Рисовать одно тело
  // нельзя: правая полка упиралась в номинал, и лист обещал ровно 100% там, где
  // клиент получает номинал и купон (замечание Руслана 31.08.2026).
  function chRevconv() {
    const HH = CH - 22;
    const K = inst.strike || 100;
    const cpn = S.revconvCoupons(inst);
    const be = S.revconvBreakeven(inst);
    const lo = Math.max(5, Math.min(K - 35, be != null && be > 0 ? be - 10 : 999, 60));
    const hi = Math.max(K + 25, 125);
    const body = v => Math.min(100, v / K * 100);
    const pay = v => body(v) + cpn;
    const yMin = Math.max(0, body(lo) - 10), yMax = Math.max(116, 100 + cpn + 10);
    const x = v => PAD + ((v - lo) / (hi - lo)) * (CW - PAD * 2);
    const y = v => HH - PAD - ((v - yMin) / (yMax - yMin)) * (HH - PAD * 2);
    const line = fn => "M" + x(lo).toFixed(1) + " " + y(fn(lo)).toFixed(1) +
      " L" + x(K).toFixed(1) + " " + y(fn(K)).toFixed(1) +
      " L" + x(hi).toFixed(1) + " " + y(fn(hi)).toFixed(1);
    // Полоса между телом и итогом — купон. Заливкой, как на витрине: третья
    // подпись с цифрой в полоске 102px не читается, а сама цифра стоит рядом
    // плиткой параметров.
    const band = "M" + x(lo).toFixed(1) + " " + y(pay(lo)).toFixed(1) +
      " L" + x(K).toFixed(1) + " " + y(pay(K)).toFixed(1) +
      " L" + x(hi).toFixed(1) + " " + y(pay(hi)).toFixed(1) +
      " L" + x(hi).toFixed(1) + " " + y(body(hi)).toFixed(1) +
      " L" + x(K).toFixed(1) + " " + y(body(K)).toFixed(1) +
      " L" + x(lo).toFixed(1) + " " + y(body(lo)).toFixed(1) + " Z";
    const gapPx = Math.abs(y(100) - y(100 + cpn));
    const withCoupon = cpn > 0
      ? '<path d="' + band + '" fill="' + C.or + '" fill-opacity="0.13"/>' +
        '<path d="' + line(body) + '" fill="none" stroke="' + C.lab + '" stroke-width="1.2" stroke-dasharray="4 4"/>' +
        '<text x="' + (CW - PAD) + '" y="' + (y(100 + cpn) - 5) + '" text-anchor="end" fill="' + C.or +
        '" font-size="10" ' + MONO + '>с купоном ' + S.fmtSmart(100 + cpn) + '%</text>' +
        (gapPx >= 13 ? '<text x="' + x(K + (hi - K) * 0.45) + '" y="' + ((y(100) + y(100 + cpn)) / 2 + 4) +
          '" text-anchor="middle" fill="' + C.or + '" font-size="10" ' + MONO + '>купон</text>' : "")
      : "";
    // Точка выхода в ноль — там, где полная выплата пересекает номинал.
    const zero = (cpn > 0 && be != null && be > lo && be < K - 1)
      ? '<circle cx="' + x(be) + '" cy="' + y(100) + '" r="3.4" fill="' + C.or + '"/>' +
        '<text x="' + (x(be) + 6) + '" y="' + (y(100) + 14) + '" fill="' + C.or + '" font-size="10" ' + MONO +
        '>б/у ' + S.fmtSmart(be) + '%</text>'
      : "";
    return '<svg viewBox="0 0 ' + CW + ' ' + HH + '" width="100%" style="display:block">' +
      '<line x1="' + PAD + '" y1="' + y(100) + '" x2="' + (CW - PAD) + '" y2="' + y(100) + '" stroke="' + C.axis + '" stroke-width="1" stroke-dasharray="4 4"/>' +
      '<text x="' + (CW - PAD) + '" y="' + (y(100) + 13) + '" text-anchor="end" fill="' + C.lab2 + '" font-size="10" ' + MONO + '>номинал 100%</text>' +
      withCoupon + zero +
      '<path d="' + line(pay) + '" fill="none" stroke="' + C.line + '" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<rect x="' + (x(K) - 4) + '" y="' + (y(pay(K)) - 4) + '" width="8" height="8" transform="rotate(45 ' + x(K) + ' ' + y(pay(K)) + ')" fill="' + C.line + '"/>' +
      '<text x="' + (x(K) - 7) + '" y="' + (y(pay(K)) - 8) + '" text-anchor="end" fill="' + C.lab2 + '" font-size="10" ' + MONO + '>страйк ' + S.fmtSmart(K) + '%</text>' +
      // Подпись наклонного участка — над САМОЙ ВЫСОКОЙ точкой под её рамкой:
      // линия идёт под углом и фиксированный отступ она бы прорезала
      (cpn > 0 ? "" : (function () {
        const lb = "перформанс от страйка";
        const half = (lb.length * 10 * 0.62 / 2 + 5) / ((CW - PAD * 2) / (hi - lo));
        const c0 = Math.max(lo + half, Math.min((lo + K) / 2, K - half));
        return '<text x="' + x(c0) + '" y="' + (y(pay(Math.min(c0 + half, K))) - 9) +
          '" text-anchor="middle" fill="' + C.lab + '" font-size="10" ' + MONO + '>' + lb + '</text>';
      })()) +
      '</svg>';
  }

  // Автоколл: возврат тела на погашении по worst-of (европейский барьер).
  function chAutocall() {
    // График автоколла ниже общего CH на 22px: у автоколла в шапке корзина
    // (+40px), и с полным графиком пример наезжал на сноску (замер: 48px у
    // AC-BIGTECH). Схема из трёх барьеров при 102px не теряет ничего.
    const HH = CH - 34;
    const prot = inst.protectionPct || 65, cpn = inst.couponBarrier || prot, call = inst.callBarrier || 120;
    const lo = Math.min(prot - 25, 35), hi = Math.max(call + 12, 132);
    const yMin = Math.max(0, lo - 8), yMax = 118;
    const x = v => PAD + ((v - lo) / (hi - lo)) * (CW - PAD * 2);
    const y = v => HH - PAD - ((v - yMin) / (yMax - yMin)) * (HH - PAD * 2);
    const line = "M" + x(lo).toFixed(1) + " " + y(lo).toFixed(1) +
      " L" + x(prot).toFixed(1) + " " + y(prot).toFixed(1) +
      " L" + x(prot).toFixed(1) + " " + y(100).toFixed(1) +
      " L" + x(hi).toFixed(1) + " " + y(100).toFixed(1);
    const vline = (v, col, label, anchor) =>
      '<line x1="' + x(v) + '" y1="' + (PAD - 3) + '" x2="' + x(v) + '" y2="' + y(yMin) + '" stroke="' + col + '" stroke-width="1" stroke-dasharray="3 4"/>' +
      '<text x="' + (x(v) + (anchor === "end" ? -5 : 5)) + '" y="' + (PAD + 5) + '" text-anchor="' + (anchor || "start") + '" fill="' + col + '" font-size="10" ' + MONO + '>' + label + '</text>';
    return '<svg viewBox="0 0 ' + CW + ' ' + HH + '" width="100%" style="display:block">' +
      '<line x1="' + PAD + '" y1="' + y(100) + '" x2="' + (CW - PAD) + '" y2="' + y(100) + '" stroke="' + C.axis + '" stroke-width="1" stroke-dasharray="4 4"/>' +
      '<text x="' + (CW - PAD) + '" y="' + (y(100) + 13) + '" text-anchor="end" fill="' + C.lab2 + '" font-size="10" ' + MONO + '>номинал 100%</text>' +
      vline(call, C.or, "автоотзыв " + S.fmtSmart(call) + "%", "end") +
      (cpn !== prot ? vline(cpn, C.lab, "купон " + S.fmtSmart(cpn) + "%", "end") : "") +
      '<path d="' + line + '" fill="none" stroke="' + C.line + '" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<circle cx="' + x(prot) + '" cy="' + y(100) + '" r="3.2" fill="' + C.line + '"/>' +
      '<text x="' + (x(prot) - 7) + '" y="' + (y(100) + 15) + '" text-anchor="end" fill="' + C.lab2 + '" font-size="10" ' + MONO + '>защита ' + S.fmtSmart(prot) + '%</text>' +
      // Отступ от САМОЙ ВЫСОКОЙ точки участка под рамкой подписи: ниже барьера
      // выплата идёт наклонной 1:1, и фиксированные 9px она прорезала насквозь
      (function () {
        const lb = "по перформансу";
        const half = (lb.length * 10 * 0.62 / 2 + 5) / ((CW - PAD * 2) / (hi - lo));
        const c0 = Math.max(lo + half, Math.min((lo + prot) / 2, prot - half));
        return '<text x="' + x(c0) + '" y="' + (y(Math.min(c0 + half, prot)) - 9) +
          '" text-anchor="middle" fill="' + C.lab + '" font-size="10" ' + MONO + '>' + lb + '</text>';
      })() +
      '</svg>';
  }

  // ── Контент ──
  let c = {};
  if (offering && inst.type === "offering") {
    const buyRub = nom * q / 100;
    c = {
      badge: offering.kind,
      subtitle: offering.teaser,
      quoteK: "цена размещения · индикативно · % от номинала",
      chart: chDiscount,
      chartCap: "Покупка по " + S.fmt2(q) + "% номинала, погашение по 100% — при отсутствии кредитного события по " + offering.reference + ". Доход — дисконт, зафиксированный в день сделки.",
      params: [
        ["Дисконт к погашению", "+" + S.fmt2(100 - q) + " п.п.", true],
        ["Погашение", "100% номинала", false],
        ["Привязка", offering.reference, false],
        ["Срок", offering.tenor, false]
      ],
      exIntro: "Номинал " + S.fmtInt(nom) + " ₽ · покупка по " + S.fmt2(q) + "% = " + S.fmtInt(buyRub) + " ₽",
      scen: [
        ["Нет кредитного события", "погашение 100% номинала", "+" + S.fmtInt(nom - buyRub) + " ₽", "var(--up)"],
        ["Кредитное событие · " + offering.reference, "выплата ниже номинала", "вплоть до 0 ₽", "var(--down)"]
      ],
      explainer: "Дисконтная структурная облигация (CLN) с привязкой к кредитному качеству " + offering.reference + ". Покупается по " + S.fmt2(q) + "% номинала; при отсутствии кредитного события по контрольному лицу погашается по 100% номинала. Доход — дисконт, зафиксированный в день сделки; купона нет.",
      underLabel: "Главный риск · кредитное событие",
      underDesc: "Кредитный риск на контрольное лицо — " + offering.reference + ". При кредитном событии (банкротство, неплатёж, реструктуризация обязательства) выплата при погашении может быть меньше номинала — вплоть до нуля."
    };
  } else if (inst.type === "warrant") {
    const isCS = inst.structure === "cs";
    const K = inst.strike, K2 = inst.strike2;
    const capPct = isCS ? (K2 - K) : 0;
    const premiumRub = nom * q / 100;
    // Сценарий роста считается ОТ ПРЕМИИ. Безубыток CALL = страйк + премия, то есть
    // рост БА на (K + q − 100) п.п. Фиксированные +30% при дорогом опционе давали
    // убыток: у SMCI с премией 67,75% безубыток только на +67,75%, и one-pager
    // иллюстрировал продукт заведомо проигрышным сценарием.
    // Берём полтора безубытка, округляем до десятков и не опускаемся ниже прежних
    // 30% — у дешёвых опционов картинка остаётся такой же, как была.
    const beUp = K + q - 100;
    const upPct = isCS
      // У колл-спреда прежний сценарий (три четверти потолка) сохраняем, но не ниже
      // безубытка с запасом и не выше потолка — за ним выплата уже не растёт.
      ? Math.min(capPct, Math.max(Math.max(5, Math.floor((capPct * 0.75) / 5) * 5),
                                  Math.ceil((beUp * 1.3) / 5) * 5))
      : Math.max(30, Math.round((beUp * 1.5) / 10) * 10);
    const payout1 = nom * S.PAYOFF.pct((inst.spot || 100) * (1 + upPct / 100), K, K2) / 100;
    const net1 = payout1 - premiumRub;
    // Потолок колл-спреда — В РУБЛЯХ и прямо в примере (правка 28.08.2026).
    // Раньше сценарий роста останавливался ниже потолка, и максимум продукта не
    // печатался на листе нигде: плитка говорила «до 50%», а сколько это денег и
    // что выше выплата НЕ растёт — агент считал в уме. У бустера такая строка
    // есть («…и выше — потолок»), у колл-спреда не было. Если сценарий роста и
    // так упёрся в потолок — строка одна, без дубля.
    const capRub = isCS ? nom * capPct / 100 : 0;
    const capNet = capRub - premiumRub;
    const capRow = [uGrew + " на " + S.fmtSmart(capPct) + "% и выше",
      "выплата " + S.fmtInt(capRub) + " ₽ — потолок",
      (capNet >= 0 ? "+" : "−") + S.fmtInt(Math.abs(capNet)) + " ₽",
      capNet >= 0 ? "var(--up)" : "var(--down)"];
    const params = [["Страйк (K)", S.fmtSmart(K) + "% нач. уровня", false]];
    if (isCS) params.push(["Потолок (K₂)", S.fmtSmart(K2) + "% · до " + S.fmtSmart(capPct) + "%", false]);
    else params.push(["Макс. убыток", "премия", false]);
    params.push(["Срок", inst.tenor, false], ["Экспозиция", "100% номинала", false]);
    c = {
      badge: isCS ? "Колл-спред · структурная облигация" : "CALL · структурная облигация",
      subtitle: "Заработать на росте " + uName + " с полной экспозицией на номинал и риском, ограниченным премией.",
      underLabel: woLabel, underDesc: woDesc,
      chart: chWarrant, params,
      chartCap: isCS
        ? "Выплата в % от номинала; " + uAxis + " — в % от начального. Выше K₂ не растёт (макс. " + S.fmtSmart(capPct) + "%). Пунктир — премия; б/у — безубыток."
        : "Выплата в % от номинала; " + uAxis + " — в % от начального. Рост выплаты не ограничен потолком. Пунктир — премия; б/у — безубыток.",
      exIntro: "Номинал " + S.fmtInt(nom) + " ₽ · премия " + S.fmt2(q) + "% = " + S.fmtInt(premiumRub) + " ₽",
      // У колл-спреда сценарий роста — СРАЗУ потолок, одной строкой «…и выше»:
      // третья строка не помещается в слайд 540px (замер: наезд на сноску 50px,
      // тот же дефект, что был у автоколлов), а определяющее число CS — именно
      // максимум. Промежуточные значения читаются с графика (линия + б/у).
      // Процент на вложенные: у варранта вложены только деньги премии, и именно
      // к ним агент и клиент относят результат (решение Руслана 29.08.2026)
      scen: [
        isCS
          ? capRow.concat([roiTxt(capNet, premiumRub)])
          : [uGrew + " на " + upPct + "%", "выплата " + S.fmtInt(payout1) + " ₽", (net1 >= 0 ? "+" : "−") + S.fmtInt(Math.abs(net1)) + " ₽", net1 >= 0 ? "var(--up)" : "var(--down)", roiTxt(net1, premiumRub)],
        [uNo, "выплаты нет — премия потеряна полностью", "−" + S.fmtInt(premiumRub) + " ₽", "var(--down)", "−100% вложенных"]
      ],
      explainer: isCS
        ? "Колл-спред — CALL с потолком выплаты. Страйк фиксируется по уровню актива в день покупки, рост засчитывается до K₂. Инвестор платит только премию (" + S.fmt2(q) + "% номинала) и получает экспозицию на весь номинал. Если " + (isWO ? "худшая бумага корзины не выросла" : "актив не вырос") + " — теряется только премия."
        : "CALL-варрант — право на выплату, равную росту " + uGenAsset + " сверх страйка. Инвестор платит только премию (" + S.fmt2(q) + "% номинала) и получает экспозицию на весь номинал без маржин-коллов. Если " + (isWO ? "худшая бумага корзины не выросла" : "актив не вырос") + " — теряется только премия."
    };
  } else if (inst.type === "discount") {
    const buyRub = nom * q / 100;
    c = {
      badge: "Дисконтная облигация",
      subtitle: "Покупка дешевле номинала, погашение по 100% — доход зафиксирован в день сделки.",
      chart: chDiscount,
      chartCap: "Покупка дешевле номинала, погашение по 100%. Доход — разница, зафиксированная в момент покупки.",
      params: [["Выплата", "100% номинала", true], ["Осталось", S.daysTo(inst.expiry) + " дн.", false], ["Купоны", "нет", false]],
      exIntro: "Номинал " + S.fmtInt(nom) + " ₽ · покупка по " + S.fmt2(q) + "% = " + S.fmtInt(buyRub) + " ₽",
      scen: [
        ["Дождались погашения", "выплата 100% номинала", "+" + S.fmtInt(nom - buyRub) + " ₽", "var(--up)", roiTxt(nom - buyRub, buyRub)],
        ["Продали раньше срока", "по текущей рыночной цене", "по рынку", "var(--nav)"]
      ],
      explainer: "Облигация покупается дешевле номинала — по " + S.fmt2(q) + "% от него. На дату погашения выплачивается полный номинал, 100%. Весь доход — дисконт: разница между ценой покупки и номиналом, известная в день сделки. Купонов нет; основной риск — кредитное качество эмитента."
    };
  } else if (inst.type === "autocall") {
    const cpnPa = inst.couponPa != null ? inst.couponPa : q;
    const prot = inst.protectionPct || 65, cpnB = inst.couponBarrier || prot, call = inst.callBarrier || 120;
    const per = inst.obsPerYear || 4, nonCall = inst.nonCall || 0;
    const cpnPer = cpnPa / per, cpnRub = nom * cpnPer / 100;
    const yrs = parseFloat(String(inst.tenor).replace(",", ".")) || 3;
    const holdRub = nom * (1 + cpnPa / 100 * yrs);
    const downLvl = Math.max(10, prot - 20), downRub = nom * downLvl / 100;
    const obsTxt = per === 4 ? "ежеквартально" : per + " раза в год";
    c = {
      badge: "Автоколл · структурная облигация",
      subtitle: "Условный купон " + S.fmt2(cpnPa) + "% годовых на корзину " + inst.underlying + " по принципу worst-of · срок " + inst.tenor + " · " + S.ccyLabel(inst) + ".",
      quoteK: "купон · % годовых · индикативно",
      chart: chAutocall,
      chartCap: "Возврат номинала на погашении в % от него; по горизонтали — уровень худшей бумаги корзины. Купоны на графике не показаны.",
      params: [["Купон", S.fmt2(cpnPa) + "% годовых", true], ["Купонный барьер", S.fmtSmart(cpnB) + "%", false], ["Барьер автоотзыва", S.fmtSmart(call) + "%", false], ["Защита на погашении", S.fmtSmart(prot) + "%", false]],
      exIntro: "Вход по номиналу " + S.fmtInt(nom) + " ₽ (100%) · купон " + S.fmt2(cpnPer) + "% за период = " + S.fmtInt(cpnRub) + " ₽",
      scen: [
        ["Корзина выше " + S.fmtSmart(cpnB) + "% весь срок", "купоны за " + inst.tenor + " и номинал", "+" + S.fmtInt(holdRub - nom) + " ₽", "var(--up)"],
        ["На погашении худшая бумага на " + downLvl + "%", "выплата по перформансу " + S.fmtInt(downRub) + " ₽", "−" + S.fmtInt(nom - downRub) + " ₽", "var(--down)"]
      ],
      explainer: "Условия считаются по <b>худшей бумаге</b> корзины (worst-of), наблюдения — " + obsTxt + ". Выше " + S.fmtSmart(cpnB) + "% начисляется купон " + S.fmt2(cpnPer) + "% номинала за период; выше " + S.fmtSmart(call) + "% выпуск гасится досрочно." + (nonCall ? " " + S.nonCallText(nonCall) + " отзыв невозможен." : "") + " На погашении номинал возвращается целиком, пока worst-of не ниже " + S.fmtSmart(prot) + "%.",
      underLabel: "Главный риск · падение корзины",
      underDesc: "Если на дату погашения худшая бумага корзины опустится ниже " + S.fmtSmart(prot) + "% начального уровня, выплата считается по её перформансу — возможна потеря части или всей суммы вложения. Отдельно действует кредитный риск эмитента облигации."
    };
  } else if (inst.type === "revconv") {
    const cpnPa = inst.couponPa != null ? inst.couponPa : q;
    const K = inst.strike || 100, per = inst.obsPerYear || 4;
    const cpnPer = cpnPa / per, cpnRub = nom * cpnPer / 100;
    const yrs = S.tenorYears(inst) || 1;
    const cpnAll = nom * cpnPa / 100 * yrs;
    const holdRub = nom + cpnAll;
    const be = S.revconvBreakeven(inst);
    const downLvl = Math.max(10, Math.round((be != null && be > 0 ? be : K - 30) - 15));
    const bodyPct = S.PAYOFF.revconv(downLvl, K);
    const downRub = nom * bodyPct / 100 + cpnAll;
    const obsTxt = per === 12 ? "ежемесячно" : per === 4 ? "ежеквартально" : per === 2 ? "раз в полгода" : per + " раза в год";
    const isWOrc = Array.isArray(inst.basket) && inst.basket.length > 1;
    const uName = isWOrc ? "худшая бумага корзины" : inst.underlying;
    const uGrewRc = isWOrc ? "Худшая бумага корзины выросла" : inst.underlying + " вырос";
    c = {
      badge: "Реверс-конвертибл · структурная облигация",
      subtitle: "Повышенный купон " + S.fmt2(cpnPa) + "% годовых на " +
        (isWOrc ? "корзину " + inst.underlying + " по принципу worst-of" : inst.underlying) +
        " — платится при любом сценарии · страйк " + S.fmtSmart(K) + "% · срок " + inst.tenor + " · " + S.ccyLabel(inst) + ".",
      quoteK: "купон · % годовых · индикативно",
      chart: chRevconv,
      chartCap: "Полная выплата за срок в % от номинала — тело плюс купоны; по горизонтали — уровень " +
        (isWOrc ? "худшей бумаги корзины" : "базового актива") + ". Пунктир — тело без купонов: зазор между линиями и есть купон.",
      params: [["Купон", S.fmt2(cpnPa) + "% годовых", true], ["Выплаты", obsTxt, false], ["Страйк", S.fmtSmart(K) + "%", false],
        be != null && be > 0 ? ["Купон покрывает до", S.fmtSmart(be) + "%", false] : ["Участие в росте", "нет", false]],
      exIntro: "Вход по номиналу " + S.fmtInt(nom) + " ₽ (100%) · купон " + S.fmt2(cpnPer) + "% за период = " + S.fmtInt(cpnRub) + " ₽",
      scen: [
        [uName + " на " + S.fmtSmart(K) + "% и выше", "номинал и купоны за " + inst.tenor,
          "+" + S.fmtInt(cpnAll) + " ₽", "var(--up)", roiTxt(cpnAll, nom)],
        ["На погашении " + uName + " на " + downLvl + "%", "тело " + S.fmt1(bodyPct) + "% плюс купоны: " + S.fmtInt(downRub) + " ₽",
          (downRub >= nom ? "+" : "−") + S.fmtInt(Math.abs(downRub - nom)) + " ₽", downRub >= nom ? "var(--up)" : "var(--down)",
          roiTxt(downRub - nom, nom)]
      ],
      explainer: "Купон " + S.fmt2(cpnPa) + "% годовых платится " + obsTxt + " <b>независимо</b> от уровня актива — это плата за принятый риск. " +
        "Тело на погашении возвращается полностью, пока актив не ниже страйка " + S.fmtSmart(K) + "%; в росте выше страйка выпуск не участвует. " +
        "Ниже страйка тело идёт по перформансу <b>от страйка</b>. Расчёт денежный, бумаги не поставляются.",
      underLabel: "Главный риск · падение актива",
      underDesc: "Если на дату погашения " + uName + " опустится ниже страйка " + S.fmtSmart(K) + "% начального уровня, тело считается по перформансу от страйка — возможна потеря значительной части вложения; купоны при этом остаются у инвестора. Отдельно действует кредитный риск эмитента облигации."
    };
  } else if (inst.type === "booster") {
    const K = inst.strike || 100, K2 = inst.strike2 || 110, ku = (inst.ku || 175) / 100;
    const capPay = K + ku * (K2 - K), maxUp = capPay - 100, kuS = Math.round(ku * 100) + "%";
    const bandUp = S.fmtSmart(K2 - 100), upFull = nom * capPay / 100, downRub = nom * 0.8;
    c = {
      badge: "Бустер · структурная облигация",
      subtitle: "Усиленное участие ×" + kuS + " в росте " + inst.underlying + " до потолка — с участием в падении 1:1.",
      quoteK: "коэффициент участия · индикативно",
      chart: chBooster,
      chartCap: "Слева от старта — падение 1:1; справа — рост ×" + kuS + " в диапазоне " + S.fmtSmart(K) + "–" + S.fmtSmart(K2) + "% до потолка +" + S.fmt1(maxUp) + "%.",
      params: [["Коэффициент участия", kuS, true], ["Диапазон роста", S.fmtSmart(K) + "–" + S.fmtSmart(K2) + "%", false], ["Макс. выплата", "+" + S.fmt1(maxUp) + "%", false], ["Срок", inst.tenor, false]],
      exIntro: "Вход по номиналу " + S.fmtInt(nom) + " ₽ (100%) · базовый актив " + inst.underlying,
      scen: [
        [inst.underlying + " вырос на " + bandUp + "% и выше", "выплата " + S.fmtInt(upFull) + " ₽ — потолок", "+" + S.fmtInt(upFull - nom) + " ₽", "var(--up)"],
        [inst.underlying + " упал на 20%", "выплата " + S.fmtInt(downRub) + " ₽ — падение 1:1", "−" + S.fmtInt(nom - downRub) + " ₽", "var(--down)"]
      ],
      explainer: "Бустер даёт усиленное участие в росте: рост базового актива в диапазоне " + S.fmtSmart(K) + "–" + S.fmtSmart(K2) + "% засчитывается с коэффициентом " + kuS + " (максимум +" + S.fmt1(maxUp) + "% к номиналу), выше — потолок. Если актив падает — участие в падении один к одному, как в самом активе. Купонов нет.",
      underLabel: "Главный риск · падение актива",
      underDesc: "Полное участие в падении базового актива: при снижении инвестор несёт убыток один к одному, вплоть до значительной части номинала. Отдельно действует кредитный риск эмитента облигации."
    };
  } else {
    // Защита капитала. Конфиг из полей инструмента + опциональные override в URL (?protect / ?part / ?cap).
    const numq = k => { const v = parseFloat(qs.get(k)); return isFinite(v) ? v : null; };
    let part = inst.participation != null ? inst.participation : 0.6;   // 0..1
    let floor = inst.protectionPct != null ? inst.protectionPct : 100;  // % защиты капитала
    let cap = inst.cap != null ? inst.cap : null;                       // потолок = макс. рост БА, % (или null)
    const oPart = numq("part"); if (oPart != null && oPart > 0) { part = oPart / 100; OVERRIDDEN.push("участие"); }
    const oProt = numq("protect"); if (oProt != null && oProt > 0 && oProt <= 100) { floor = oProt; OVERRIDDEN.push("защита"); }
    const oCap = numq("cap"); if (oCap != null) { cap = oCap > 0 ? oCap : null; OVERRIDDEN.push("потолок"); }

    const protK = inst.strike || 100;                       // страйк опциона, % от начального уровня
    const protOff = protK - 100;
    // Сценарии считаем тем же расчётом, что и витрина, — иначе печатный лист
    // расходится с сайтом (так и было при защите ниже 100%).
    const protCfg = { type: "protection", participation: part, protectionPct: floor, strike: protK, cap: cap };
    const capPay = cap != null ? Math.round(S.calc.pct(protCfg, cap)) : null;
    const partPct = Math.round(part * 100);
    const entryRub = nom * q / 100;
    const upPct = protOff + 20, downPct = 20;
    const payUpPct = S.calc.pct(protCfg, upPct);
    const payUpRub = nom * payUpPct / 100, netUp = payUpRub - entryRub;
    const payDownPct = S.calc.pct(protCfg, -downPct);
    const downRub = nom * payDownPct / 100;

    let subtitle, chartCap, explainer;
    if (floor >= 100 && cap == null) subtitle = "Возврат 100% номинала при любом падении и участие в росте " + uName + " без потолка.";
    else if (floor >= 100) subtitle = "Полная защита номинала и участие в росте " + uName + " — с потолком выплаты " + capPay + "%.";
    else if (cap == null) subtitle = "Гарантированный минимум " + S.fmtSmart(floor) + "% номинала и участие в росте " + uName + " без потолка.";
    else subtitle = "Гарантированный минимум " + S.fmtSmart(floor) + "% номинала и участие в росте " + uName + " с потолком " + capPay + "%.";

    chartCap = "Выплата в % от номинала. " +
      (floor >= 100 ? "Ниже S₀ — не меньше 100%." : "Гарантированный минимум — " + S.fmtSmart(floor) + "% (макс. убыток " + S.fmtSmart(100 - floor) + "%).") +
      " Выше " + (protOff > 0 ? "страйка " + S.fmtSmart(protK) + "%" : "S₀") + " — " + partPct + "% роста" + (cap != null ? " до потолка " + capPay + "%." : ", без потолка.");

    explainer = "Облигация возвращает " + (floor >= 100 ? "100% номинала при любом сценарии" : "не менее " + S.fmtSmart(floor) + "% номинала (риск ограничен " + S.fmtSmart(100 - floor) + "%)") +
      ". Если " + uGrewLow + (protOff > 0 ? " выше страйка " + S.fmtSmart(protK) + "% начального уровня" : "") + " — " + (partPct === 100 ? "засчитывается весь " + uPoss + " рост" : "сверху выплачивается " + partPct + "% этого роста") +
      (cap != null ? ", но не выше потолка " + capPay + "% номинала" : ", без ограничения сверху") + ". Риск — кредитное качество эмитента.";

    c = {
      badge: "Облигация · защита капитала",
      subtitle: subtitle,
      underLabel: woLabel, underDesc: woDesc,
      chart: () => chProtection({ part: part, floor: floor, cap: cap, strike: protK }),
      chartCap: chartCap,
      // Ровно 4 плитки: сетка в две колонки, третий ряд не влезает в слайд 960×540
      // и наезжает на дисклеймер. Четвёртая плитка — по ситуации: у продукта со
      // страйком выше S₀ это ключевой параметр, иначе показываем потолок.
      params: [
        ["Защита капитала", S.fmtSmart(floor) + "%", false],
        ["Участие в росте", partPct + "%", true],
        ["Срок", inst.tenor, false],
        protK > 100
          ? ["Страйк опциона", S.fmtSmart(protK) + "%", false]
          : ["Потолок", cap != null ? "+" + S.fmtSmart(cap) + "%" : "нет", false]
      ],
      exIntro: "Номинал " + S.fmtInt(nom) + " ₽ · вход по " + S.fmt2(q) + "% = " + S.fmtInt(entryRub) + " ₽",
      scen: [
        [uGrew + " на " + upPct + "%", "выплата " + S.fmtSmart(payUpPct) + "% номинала", (netUp >= 0 ? "+" : "−") + S.fmtInt(Math.abs(netUp)) + " ₽", netUp >= 0 ? "var(--up)" : "var(--down)"],
        floor >= 100
          ? [uFell, "защита — 100% номинала", S.fmtInt(downRub) + " ₽", "var(--nav)"]
          : [uFell + " на " + downPct + "%", "минимум — " + S.fmtSmart(floor) + "% номинала", S.fmtInt(downRub) + " ₽", "var(--down)"]
      ],
      explainer: explainer
    };
  }

  // Для размещений добавляем в параметры one-pager серию и ISIN выпуска.
  if (offering && c.params) {
    if (offering.serial) c.params.push(["Серия", offering.serial, false]);
    if (offering.isin) c.params.push(["ISIN", offering.isin, false]);
  }

  // ── Строительные блоки слайда 2 ──

  // Блок корзины: тикеры из basket, названия — из underlying (порядок совпадает).
  // Если списки разошлись по длине, показываем только тикеры — врать подписями нельзя.
  const bkNames = String(inst.underlying || "").split("/").map(x => x.trim()).filter(Boolean);
  const bkNamed = isWO && bkNames.length === inst.basket.length;
  const basketHTML = !isWO ? "" :
    '<div class="basket"><div class="bk-lbl">Риск по худшей бумаге</div><div class="bk-row">' +
    inst.basket.map(function (tk, i) {
      return '<span class="bk-chip"><b>' + tk + '</b>' + (bkNamed ? '<i>' + bkNames[i] + '</i>' : '') + '</span>';
    }).join("") + '</div></div>';
  const howHTML =
    '<div class="callout"><div class="lbl">Как устроен продукт</div><div class="expl">' + c.explainer + '</div>' +
      '<div class="under"><div class="lbl">' + (c.underLabel || ((isWO ? 'О корзине · ' : 'О базовом активе · ') + inst.underlying)) + '</div>' +
        '<div class="expl">' + (c.underDesc || underDesc()) + '</div></div></div>';
  const chartHTML = '<div class="chart-box"><div class="chart-t">Диаграмма выплат</div>' + c.chart() + '<div class="chart-cap">' + c.chartCap + '</div></div>';
  const paramsHTML = cols => '<div class="params c' + cols + '">' + c.params.map(p =>
    '<div class="param"><div class="v' + (p[2] ? " or" : "") + '">' + p[1] + '</div><div class="k">' + p[0] + '</div></div>').join("") + '</div>';
  const exampleHTML = scenCols => '<div class="example"><div class="lbl">Пример расчёта</div><div class="ex-intro">' + c.exIntro + '</div>' +
    '<div class="scen c' + scenCols + '">' + c.scen.map(s => '<div class="scard"><div><div class="st">' + s[0] + '</div><div class="sd">' + s[1] + '</div></div><div class="srw"><div class="sr" style="color:' + s[3] + '">' + s[2] + '</div>' + (s[4] ? '<div class="sr-sub">' + s[4] + '</div>' : '') + '</div></div>').join("") + '</div>' +
    (isForeign ? '<div class="fx-inline">' + fxShort + '</div>' : '') + '</div>';

  // Двухколоночная парадигма: слева описание + компактные параметры, справа диаграмма + пример
  const bodyHTML =
    '<div class="c-row">' +
      '<div class="col between">' + howHTML + paramsHTML(2) + '</div>' +
      '<div class="col between">' + chartHTML + exampleHTML(1) + '</div>' +
    '</div>';

  let html = "";

  // Слайд 1 — титул
  html += '<section class="slide t-slide">' +
    '<div class="t-blocks"><i style="top:150px;right:0;width:56px;height:104px"></i><i style="top:264px;right:0;width:28px;height:28px;opacity:.5"></i></div>' +
    '<div class="t-top"><div class="brand">' + starSvg(20, "#EE7D1B") + ' Инвестиционные решения</div><div class="qual">' + QUAL + '</div></div>' +
    '<div><div class="t-badge">' + c.badge + '</div><div class="t-title">' + name + '</div><div class="t-bar"></div>' + basketHTML + '</div>' +
    '<div class="t-meta">' + dateS + '</div>' +
    '</section>';

  // Слайд 2 — описание. При корзине в шапке (+40px высоты) слайд помечается
  // basketed: уплотнения ниже возвращают примеру и плиткам место над сноской
  html += '<section class="slide' + (basketHTML ? " basketed" : "") + '">' +
    '<div class="c-head"><div><div class="c-title">' + name + '</div><span class="c-badge">' + c.badge + '</span>' +
      '<div class="c-sub">' + c.subtitle + '</div>' + basketHTML + '</div>' +
      '<div class="c-quote"><div class="v">' + S.quoteBig(q) + '</div><div class="k">' + (c.quoteK || "котировка · индикативно · % от номинала") + '</div></div></div>' +
    '<div class="c-body">' + bodyHTML + '</div>' +
    (OVERRIDDEN.length
      ? '<div class="c-over">Параметры изменены вручную через адрес страницы (' +
        esc(OVERRIDDEN.join(", ")) + '). Это не котировка витрины.</div>'
      : '') +
    '<div class="c-foot">Пример иллюстративный, без учёта комиссий и налогов.</div>' +
    '</section>';

  // Слайд 3 — дисклеймер
  html += '<section class="slide d-slide">' +
    '<div><div class="d-title">Ограничение ответственности</div><div class="d-bar"></div></div>' +
    '<div class="d-body">' + (isForeign ? [S.LEGAL.fx].concat(S.LEGAL.onepager) : S.LEGAL.onepager).map(p => "<p>" + p + "</p>").join("") + '</div>' +
    '<div class="d-meta">' + dateS + ' · Инвестиционные решения</div>' +
    '</section>';

  // ПОДВАЛ ЛИСТА. До 28.08.2026 на трёх печатных страницах не было ни слова
  // «Rumberg», ни адреса сайта, ни контакта — всё это жило в панели, которую
  // печать скрывает. Клиент сохранял PDF, пересылал дальше, и документ был
  // анонимным. Метка сейлза сюда же: весь остальной проект построен вокруг
  // ref-атрибуции, а в единственном документе, остающемся у клиента, её не было.
  { const ref = refTag();
    const site = "invest.rumberg.ru" + (ref ? "/?ref=" + ref : "");
    html = html.replace(/<\/section>$/,
      '<div class="sheet-foot">' +
        '<span class="sf-b">Rumberg</span>' +
        '<span class="sf-s">инвестиционные решения · <b>' + esc(site) + '</b></span>' +
      '</div></section>');
  }

  document.getElementById("deck").innerHTML = html;

  // Лист — фиксированной высоты, и колонка не резиновая: если разбор у продукта
  // длиннее обычного, блок параметров вылезает за низ колонки и наезжает на
  // строку «Пример иллюстративный…» (поймано на реверс-конвертибле, −35px).
  // Раньше от этого спасал только класс basketed, и включался он по признаку
  // корзины — то есть по типу продукта, а не по факту переполнения. Теперь
  // замеряем готовый лист и ужимаем ТОЛЬКО тот, где переполнение действительно
  // есть: сначала набором basketed (он проверен на печати), затем второй
  // ступенью tighter. Кегль прозы при этом не трогаем — 10,5px и так предел.
  (function fitSlides() {
    function overflows(sl) {
      var cols = sl.querySelectorAll(".col.between");
      for (var c = 0; c < cols.length; c++) {
        var bottom = cols[c].getBoundingClientRect().bottom, kids = cols[c].children;
        for (var k = 0; k < kids.length; k++) {
          if (kids[k].getBoundingClientRect().bottom > bottom + 2) return true;
        }
      }
      return false;
    }
    var slides = document.querySelectorAll("#deck .slide");
    for (var i = 0; i < slides.length; i++) {
      var sl = slides[i];
      if (!overflows(sl)) continue;
      sl.classList.add("basketed");
      if (!overflows(sl)) continue;
      sl.classList.add("tighter");
      // Молча обрезанный лист хуже некрасивого: если и второй ступени не хватило,
      // это видно в консоли, а не только глазами на распечатке.
      if (overflows(sl)) console.warn("one-pager: содержимое не помещается в лист даже после уплотнения");
    }
  })();

  { const shHost = document.getElementById("sh-host");
    if (shHost && window.Share) {
      const prodUrl = offering
        ? new URL("offerings", location.href).href
        : new URL("instrument?id=" + encodeURIComponent(inst.id), location.href).href;
      const params = [["Цена входа", S.fmt2(q) + "% ном."]].concat((c.params || []).map(p => [p[0], p[1]]));
      Share.attach(shHost, { url: prodUrl, title: name, name: name, pitch: c.subtitle, params: params });
      const ctHost = document.getElementById("ct-host");
      if (ctHost && window.Contact) Contact.attach(ctHost, { title: name, url: prodUrl, id: offering ? offering.id : inst.id });
    } }

  // Авто-печать — только на десктопе. На телефоне window.print() бесполезен
  // и может оставлять страницу в print-раскладке (слайды 960px без масштаба).
  var isNarrow = Math.min(
    (window.screen && screen.width) || Infinity,
    window.innerWidth || Infinity
  ) < 972;
  if (qs.get("print") === "1" && !isNarrow) {
    (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve())
      .then(() => setTimeout(() => window.print(), 400));
  }

  // ?debug=1 — диагностический оверлей (реальные метрики на самом устройстве).
  // Если зелёной плашки НЕ видно — значит браузер отдал закешированный старый файл.
  if (qs.get("debug") === "1") {
    var dbg = document.createElement("div");
    dbg.style.cssText = "position:fixed;left:6px;top:56px;z-index:99999;background:#000;color:#0f0;font:12px/1.45 monospace;padding:8px 10px;border-radius:6px;white-space:pre;box-shadow:0 2px 12px rgba(0,0,0,.6)";
    var sd = document.querySelector(".slide");
    dbg.textContent = [
      "BUILD 630eaea+dbg",
      "screen=" + screen.width + "x" + screen.height,
      "inner=" + window.innerWidth + "x" + window.innerHeight,
      "client=" + document.documentElement.clientWidth,
      "dpr=" + window.devicePixelRatio,
      "vp=" + document.getElementById("vp").getAttribute("content"),
      "slideW=" + (sd ? Math.round(sd.getBoundingClientRect().width) : "-"),
      "zoom=" + (sd ? getComputedStyle(sd).zoom : "-"),
      "printMedia=" + (window.matchMedia && window.matchMedia("print").matches),
      "scrollW=" + document.documentElement.scrollWidth,
      "slides=" + document.querySelectorAll(".slide").length
    ].join("\n");
    document.body.appendChild(dbg);
  }
  }

</script>
</body>
