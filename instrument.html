<style>
  :root {
    --canvas: #0B0C10; --card: #14161C; --panel-2: #191B22; --tile: rgba(255,255,255,0.045);
    --black: #1A1919;
    --ink: #F2F3F7; --hushed: rgba(242,243,247,0.64); --faint: rgba(242,243,247,0.56);
    --border: rgba(255,255,255,0.11); --border-soft: rgba(255,255,255,0.07);
    --solar: #EE7D1B; --solar-l: #F58E33;
    --spruce: #5E9B82; --steel: #4F86E6; --amber: #E0A24A;
    --up: #55C08A; --down: #E0705A; --loss: #E0705A;
    --f-body: 'Onest', system-ui, sans-serif;
    --f-mono: 'JetBrains Mono', Consolas, monospace;
    --display: 'Rubik', 'Onest', system-ui, sans-serif;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--canvas); color: var(--ink); font-family: var(--f-body); -webkit-font-smoothing: antialiased; }
  a { text-decoration: none; color: inherit; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 44px 64px; }

  .nav { position: sticky; top: 0; z-index: 20; background: rgba(11,12,16,0.82); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
  .nav-in { max-width: 1080px; margin: 0 auto; padding: 0 44px; height: 62px; display: flex; align-items: center; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-name { font-size: 14.5px; font-weight: 600; }
  .topnav { margin-left: auto; display: flex; align-items: center; gap: 22px; font-size: 14px; font-weight: 500; }
  .topnav a { color: var(--hushed); transition: color .2s; }
  .topnav a:hover { color: var(--ink); }
  .topnav a[aria-current="page"] { color: var(--ink); font-weight: 600; }
  .btn-solar { background: var(--solar); color: #0C0A08 !important; border-radius: 6px; padding: 8px 14px; display: inline-flex; align-items: center; gap: 7px; transition: background .3s ease-in-out; }
  .btn-solar:hover { background: var(--solar-l); }

  .crumbs { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--hushed); padding: 26px 0 28px; }
  .crumbs a:hover { color: var(--ink); }
  .crumbs .sep { color: var(--faint); }
  .crumbs .here { color: var(--ink); font-weight: 500; }

  .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; flex-wrap: wrap; margin-bottom: 30px; }
  .title-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
  h1 { margin: 0; font-family: var(--display); font-size: 28px; font-weight: 400; letter-spacing: -0.02em; line-height: 1.1; }
  .badge { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink); background: rgba(255,255,255,0.08); border-radius: 6px; padding: 4px 9px; }
  .subtitle { font-size: 14px; color: var(--hushed); }
  .btn-pdf { margin-top: 14px; display: inline-flex; align-items: center; gap: 8px; background: var(--solar); color: var(--ink); border-radius: 6px; padding: 9px 16px; font-size: 13.5px; font-weight: 500; transition: background .3s ease-in-out; }
  .btn-pdf:hover { background: var(--solar-l); }
  .btn-pdf svg { display: block; }
  .actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
  .actions .btn-pdf { margin-top: 0; }
  .btn-secondary { background: transparent !important; color: var(--ink) !important; border: 1px solid var(--border); font-weight: 500; }
  .btn-secondary:hover { background: rgba(255,255,255,0.06) !important; }
  .btn-secondary svg path { stroke: var(--ink) !important; }
  /* Содержимое блока котировки выравниваем по ЛЕВОМУ краю: при переносе шапки
     (узкий экран) блок падает под подзаголовок, и flex-end оставлял число
     висеть посередине строки вместо левого края страницы. */
  .quote-block { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
  .quote-big { font-family: var(--f-mono); font-size: 36px; font-weight: 500; letter-spacing: -0.02em; }
  .quote-big .q-dec { font-size: 0.6em; }
  .quote-sub { font-size: 12.5px; color: var(--faint); }
  .quote-chg { font-size: 14px; font-weight: 600; }

  .grid { display: grid; grid-template-columns: 1.55fr 1fr; gap: 20px; align-items: stretch; }
  .panel { background: var(--card); border: 1px solid var(--border-soft); border-radius: 14px; padding: 22px 24px; }
  .chart-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
  .chart-title { font-size: 15px; font-weight: 600; color: var(--ink); }
  .tabs { display: flex; gap: 4px; background: rgba(255,255,255,0.06); border-radius: 10px; padding: 4px; }
  .tab { border: none; border-radius: 7px; padding: 6px 16px; font-size: 13px; font-weight: 500; cursor: pointer; background: transparent; color: var(--hushed); font-family: var(--f-body); }
  .tab.active { font-weight: 600; background: #262A33; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.35); }
  .chart-caption { margin-top: 16px; font-size: 12.5px; line-height: 1.5; color: var(--faint); }

  .metrics { display: flex; flex-direction: column; gap: 10px; }
  .metric { background: var(--card); border: 1px solid var(--border-soft); border-radius: 12px; padding: 13px 17px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .metric .k { font-size: 13.5px; color: var(--hushed); }
  .metric .v { font-family: var(--f-mono); font-size: 14.5px; text-align: right; }

  .section { margin-top: 20px; background: var(--card); border: 1px solid var(--border-soft); border-radius: 14px; padding: 26px 28px; }
  .section h2 { margin: 0 0 6px; font-family: var(--f-mono); font-size: 11px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--hushed); }
  .intro { font-size: 14px; color: var(--hushed); margin: 10px 0 8px; }
  .scenario { display: grid; grid-template-columns: 1.4fr 1.2fr 0.8fr; gap: 16px; align-items: center; padding: 14px 0; border-top: 1px solid rgba(255,255,255,0.07); }
  .scenario .l { font-size: 14.5px; font-weight: 600; }
  .scenario .d { font-size: 13.5px; color: var(--hushed); }
  .scenario .r { text-align: right; font-family: var(--f-mono); font-size: 15px; }
  .explainer { font-size: 14.5px; line-height: 1.68; color: var(--hushed); max-width: 760px; text-wrap: pretty; margin: 12px 0 0; }
  .facts { display: flex; gap: 28px; flex-wrap: wrap; margin-top: 22px; padding-top: 22px; border-top: 1px solid rgba(255,255,255,0.07); }
  .fact { display: flex; flex-direction: column; gap: 5px; min-width: 150px; max-width: 220px; }
  .fact .k { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: 0.06em; }
  .fact .v { font-size: 14px; line-height: 1.45; }

  /* Калькулятор выплаты — перенесён с доски, чтобы клиент по ссылке мог прикинуть сам */
  .calc { background: var(--tile); border: 1px solid var(--border-soft); border-radius: 10px; padding: 15px 16px; }
  .calc-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 13px; }
  .calc-l { font-size: 13px; color: var(--hushed); }
  .calc-l b { color: var(--ink); font-family: var(--f-mono); font-weight: 500; }
  .calc-input { width: 150px; background: var(--card); border: 1px solid var(--border); border-radius: 7px; padding: 8px 11px; color: var(--ink); font-family: var(--f-mono); font-size: 16px; text-align: right; }
  .calc-input:focus { outline: 2px solid var(--solar); outline-offset: 1px; }
  .calc-range { flex: 1; max-width: 58%; accent-color: var(--solar); cursor: pointer; }
  .calc-out { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 2px; }
  .calc-o { background: var(--card); border: 1px solid var(--border-soft); border-radius: 8px; padding: 11px 13px; }
  .calc-o .v { font-family: var(--f-mono); font-size: 19px; font-weight: 600; letter-spacing: -0.01em; }
  .calc-o .k { font-size: 11px; color: var(--faint); margin-top: 3px; }
  .calc-note { margin-top: 11px; font-size: 11.5px; line-height: 1.45; color: var(--faint); }
  .disclaimer { margin-top: 20px; font-size: 12px; line-height: 1.5; color: var(--faint); }

  /* Экран «продукта нет»: снят с витрины, битая или устаревшая ссылка */
  .gone { max-width: 560px; margin: 72px auto 0; text-align: center; }
  .gone-k { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--solar); }
  .gone h1 { margin: 14px 0 0; }
  .gone p { margin: 14px 0 0; font-size: 14.5px; line-height: 1.65; color: var(--hushed); text-wrap: pretty; }
  .gone-act { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 26px; }
  .gone-act a { padding: 10px 17px; font-size: 13.5px; font-weight: 500; }

  @media (max-width: 900px) {
    .wrap { padding: 0 20px 48px; }
    .gone { margin-top: 44px; }
    .nav-in { height: auto; flex-wrap: wrap; padding: 12px 20px; row-gap: 10px; }
    .topnav { margin-left: 0; width: 100%; gap: 16px; font-size: 13.5px; }
    .grid { grid-template-columns: 1fr; }
    .scenario { grid-template-columns: 1fr; gap: 4px; }
    .scenario .r { text-align: left; }
  }
  @media print {
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    .nav, .tabs, .crumbs { display: none !important; }
    body { background: #fff; }
    .panel, .section, .metric { border: 1px solid #CFCFCF; box-shadow: none; }
  }
</style>

<script>
  const S = window.SITE;
  const inst = S.findInstrument(new URLSearchParams(location.search).get("id"));

  // Продукта с таким id в каталоге нет — показываем честный экран и НЕ рендерим
  // карточку. Раньше findInstrument молча возвращал первый инструмент каталога:
  // клиент по устаревшей ссылке видел чужой продукт с настоящей котировкой.
  if (!inst) {
    document.title = "Продукт снят с витрины — Rumberg";
    document.querySelector(".wrap").innerHTML =
      '<div class="gone">' +
        '<div class="gone-k">ссылка устарела</div>' +
        '<h1>Продукт снят с витрины</h1>' +
        '<p>Этого продукта больше нет в каталоге: условия могли измениться, а выпуск — уже разместиться. ' +
        'Актуальные инструменты с котировками собраны на доске. Если нужен именно этот — напишите, подберём аналог.</p>' +
        '<div class="gone-act">' +
          '<a class="btn-solar" href="board.html">Открыть доску</a>' +
          '<a class="btn-solar btn-secondary" href="https://t.me/Rumberb_Sales_Team_bot" target="_blank" rel="noopener">Написать в Telegram</a>' +
        '</div>' +
      '</div>';
  } else {
  const t = S.TYPES[inst.type];
  const U = S.underlyingInfo(inst.underlying);
  let mode = "payoff";

  document.title = S.displayName(inst) + " — " + t.title;

  // --- Графики (SVG строками) ---
  const W = 620, H = 300, PAD = 28;
  const MONO = 'font-family="JetBrains Mono, monospace"';
  const C = { line: "#E7E9F0", gold: "#EE7D1B", grid: "rgba(255,255,255,0.09)", axis: "rgba(255,255,255,0.17)", lab: "rgba(255,255,255,0.46)", lab2: "rgba(255,255,255,0.68)", quote: "#E7E9F0" };

  function chartUnderlying() {
    const data = U.history;
    const PADL = 60, PADR = 28, PADT = 26, PADB = 42;
    const min = Math.min(...data), max = Math.max(...data), rng = (max - min) || 1;
    const x = i => PADL + (i / (data.length - 1)) * (W - PADL - PADR);
    const y = v => PADT + (1 - (v - min) / rng) * (H - PADT - PADB);
    const pts = data.map((v, i) => [x(i), y(v)]);
    const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
    const area = line + " L" + x(data.length - 1).toFixed(1) + " " + (H - PADB) + " L" + PADL + " " + (H - PADB) + " Z";
    // Сетка + подписи оси OY (значение актива)
    let grid = "";
    for (let g = 0; g <= 3; g++) {
      const val = max - (g / 3) * (max - min);
      const gy = y(val);
      grid += '<line x1="' + PADL + '" y1="' + gy.toFixed(1) + '" x2="' + (W - PADR) + '" y2="' + gy.toFixed(1) + '" stroke="' + C.grid + '" stroke-width="1"/>' +
        '<text x="' + (PADL - 8) + '" y="' + (gy + 4).toFixed(1) + '" text-anchor="end" fill="' + C.lab + '" font-size="11" ' + MONO + '>' + S.fmtSmart(val) + '</text>';
    }
    // Подписи оси OX (месяцы, последняя точка — текущий месяц)
    const MONTHS = ["янв", "фев", "мар", "апр", "май", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];
    const now = new Date();
    let xlab = "";
    for (let i = 0; i < data.length; i++) {
      if ((data.length - 1 - i) % 2) continue;
      const d = new Date(now.getFullYear(), now.getMonth() - (data.length - 1 - i), 1);
      xlab += '<text x="' + x(i).toFixed(1) + '" y="' + (H - PADB + 20) + '" text-anchor="middle" fill="' + C.lab + '" font-size="11" ' + MONO + '>' + MONTHS[d.getMonth()] + '</text>';
    }
    const axes = '<line x1="' + PADL + '" y1="' + (H - PADB) + '" x2="' + (W - PADR) + '" y2="' + (H - PADB) + '" stroke="' + C.axis + '" stroke-width="1"/>' +
      '<line x1="' + PADL + '" y1="' + PADT + '" x2="' + PADL + '" y2="' + (H - PADB) + '" stroke="' + C.axis + '" stroke-width="1"/>' +
      '<text x="' + (PADL - 8) + '" y="14" text-anchor="end" fill="' + C.lab + '" font-size="11" ' + MONO + '>' + (U.unit || "") + '</text>';
    const last = pts[pts.length - 1];
    const label = inst.uRef || (S.fmtSmart(data[data.length - 1]) + (U.unit ? " " + U.unit : ""));
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" style="display:block">' + grid + axes + xlab +
      '<defs><linearGradient id="fillu" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="' + C.quote + '" stop-opacity="0.14"/><stop offset="100%" stop-color="' + C.quote + '" stop-opacity="0"/></linearGradient></defs>' +
      '<path d="' + area + '" fill="url(#fillu)"/>' +
      '<path d="' + line + '" fill="none" stroke="' + C.quote + '" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<circle cx="' + last[0] + '" cy="' + last[1] + '" r="4.5" fill="' + C.quote + '"/>' +
      '<text x="' + (W - PADR) + '" y="' + (last[1] - 12) + '" text-anchor="end" fill="' + C.quote + '" font-size="12" ' + MONO + '>' + label + '</text>' +
      '</svg>';
  }

  // Графики выплат — общие с доской, живут в data/lib.js. Пока копия была
  // на каждой странице, оси у типов продуктов назывались по-своему и нуля
  // на них не было видно (правка по фидбеку 10.08.2026).
  // На узком экране viewBox уже, поэтому кегль подписей задаём крупнее: иначе
  // 11px внутри 620-й системы координат сжимаются до нечитаемых ~5px.
  const chOpt = () => (window.innerWidth < 620
    ? { W: 380, H: 280, colors: C, padL: 50, padR: 14, padT: 18, padB: 46, font: 13, xCount: 3, yCount: 3 }
    : { W: W, H: H, colors: C, padL: 60, padR: 28, padT: 22, padB: 50 });
  const chartPayoff = () => (inst.type === "discount" ? S.discountChart(inst, chOpt()) : S.payoffChart(inst, chOpt()));

  // --- Контент по типу продукта ---
  const nom = inst.minNom;
  let content = {};

  // Worst-of: продукт на корзину — весь расчёт по ХУДШЕЙ бумаге. Формулировки те же,
  // что у автоколлов и на доске: одно имя одного принципа на всей витрине.
  const isWO = Array.isArray(inst.basket) && inst.basket.length > 1;
  const uGrew = isWO ? "Худшая бумага корзины выросла" : inst.underlying + " вырос";
  const uFell = isWO ? "Худшая бумага корзины упала" : inst.underlying + " упал";
  const uNo = isWO ? "Худшая бумага корзины не выросла" : inst.underlying + " не вырос";
  const uNom = isWO ? "худшая бумага корзины" : "базовый актив";
  const uGen = isWO ? "худшей бумаги корзины" : "базового актива";
  const uAxis = isWO ? "уровень ХУДШЕЙ бумаги корзины" : "уровень БА";
  const woBadge = isWO ? " · worst-of" : "";
  const woFact = ["Принцип", "Worst-of — выплата считается по ХУДШЕЙ бумаге корзины (" + inst.underlying + "), а не по средней"];

  if (inst.type === "warrant") {
    const isCS = inst.structure === "cs";
    const K = inst.strike, K2 = inst.strike2;
    const spot = inst.spot || 100;
    const strikeTxt = S.fmtSmart(K) + "% — уровень базового актива в день покупки" + (K > 100 ? " (на " + S.fmtSmart(K - 100) + "% выше)" : "");
    const premiumRub = nom * inst.quote / 100;
    const upPct = Math.max(16, Math.ceil((inst.quote + 6) / 5) * 5);
    const payout1 = nom * S.PAYOFF.pct(spot * (1 + upPct / 100), K, K2) / 100;
    const net1 = payout1 - premiumRub;
    const capPct = isCS ? (K2 - K) : 0;
    const capRub = nom * capPct / 100;
    const chgSign = inst.chg > 0 ? "+" : inst.chg < 0 ? "−" : "";
    const wMetrics = [
      ["Котировка (премия)", S.fmt2(inst.quote) + "%"],
      ["Изм. за день", chgSign + S.fmt1(Math.abs(inst.chg)) + " п.п."],
      ["Страйк (K)", S.fmtSmart(K) + "% нач. уровня"]
    ];
    if (isCS) wMetrics.push(["Потолок (K₂)", S.fmtSmart(K2) + "% · выплата ≤ " + S.fmtSmart(capPct) + "%"]);
    wMetrics.push(["Срок", inst.tenor]);
    if (inst.expiry) wMetrics.push(["Экспирация", inst.expiry]);
    wMetrics.push(["Валюта", inst.currency || "RUB"]);
    if (isWO) wMetrics.push(["Корзина", inst.underlying + " · выплата по худшей"]);
    if (inst.uRef) wMetrics.push([inst.underlying + " сегодня", inst.uRef]);
    wMetrics.push(["Мин. номинал", S.fmtInt(nom) + " ₽"]);
    const wScen = [
      [uGrew + " на " + upPct + "%", "Выплата " + S.fmtInt(payout1) + " ₽", (net1 >= 0 ? "+" : "−") + S.fmtInt(Math.abs(net1)) + " ₽", net1 >= 0 ? "var(--up)" : "var(--loss)"]
    ];
    if (isCS) {
      const capNet = capRub - premiumRub;
      wScen.push([uGrew + " на 70% — выше потолка", "Выплата " + S.fmtInt(capRub) + " ₽ — максимум", (capNet >= 0 ? "+" : "−") + S.fmtInt(Math.abs(capNet)) + " ₽", capNet >= 0 ? "var(--up)" : "var(--loss)"]);
    }
    wScen.push([uNo, "Выплаты нет", "−" + S.fmtInt(premiumRub) + " ₽", "var(--loss)"]);
    const wFacts = isWO ? [woFact, ["Страйк", strikeTxt]] : [["Страйк", strikeTxt]];
    if (isCS) wFacts.push(["Потолок", "K₂ = " + S.fmtSmart(K2) + "%: выплата не выше " + S.fmtSmart(capPct) + "% номинала"]);
    wFacts.push(
      ["Котировка", "В процентах от номинала"],
      ["Стиль", "Европейский — выплата на дату экспирации"],
      ["Максимальный убыток", "Уплаченная премия"],
      ["Мин. номинал", S.fmtInt(nom) + " ₽"]
    );
    content = {
      badge: (isCS ? "КОЛЛ-СПРЕД · варрант" : "CALL · варрант") + woBadge,
      subtitle: (isCS ? "Колл-спред на рост: " : "Варрант на рост: ") + (isWO ? "корзина " : "") + inst.underlying +
        (isWO ? " — по худшей бумаге" : "") + " · Срок " + inst.tenor,
      explainer: isCS
        ? "Колл-спред — CALL с потолком выплаты. Страйк K фиксируется по уровню базового актива в день покупки (100%), рост засчитывается до K₂ = " + S.fmtSmart(K2) + "%: максимальная выплата — " + S.fmtSmart(capPct) + "% номинала. За счёт этого ограничения премия ниже, чем у обычного CALL. Если актив не вырос — выплаты нет, потеря ограничена премией."
        : "CALL-варрант — право на выплату при росте базового актива выше страйка. Страйк: " + strikeTxt + ". Если на экспирацию актив выше страйка, выплата растёт вместе с ним. Если роста до страйка нет — выплаты нет, потеря ограничена премией.",

        ? "Выплата на экспирацию в % от номинала; " + uAxis + " — в % от начального. Выше K₂ выплата не растёт: максимум " + S.fmtSmart(capPct) + "%. Пунктир — премия; б/у — безубыточность."

      metrics: wMetrics,
      exampleIntro: "Номинал " + S.fmtInt(nom) + " ₽ · премия " + S.fmt2(inst.quote) + "% = " + S.fmtInt(premiumRub) + " ₽",
      scenarios: wScen,
      facts: wFacts
    };
  } else if (inst.type === "discount") {

        ["Изм. за день", (inst.chg > 0 ? "+" : "−") + S.fmt1(Math.abs(inst.chg)) + " п.п."],

        ["Дождались погашения " + inst.expiry, "Выплата " + S.fmtInt(nom) + " ₽ — 100% номинала", "+" + S.fmtInt(nom - buyRub) + " ₽", "var(--up)"],

        ["Доход", "Дисконт: номинал минус цена покупки"],
        ["Купоны", "Нет — весь доход в дисконте"],
        ["Риск", "Кредитное качество эмитента"],
        ["Мин. номинал", S.fmtInt(nom) + " ₽"]

  } else if (inst.type === "autocall") {

        (inst.settle && inst.settle !== inst.currency ? " Экономика продукта считается в " + inst.currency + ", денежные расчёты идут в рублях." : ""),

      payoffCaption: "Возврат номинала на погашении в % от него; по горизонтали — уровень худшей бумаги корзины в % от начального. Купоны здесь не показаны: они начисляются отдельно на датах наблюдения.",

        ["Купон", S.fmt2(cpnPa) + "% годовых · индикативно"],

        ["Барьер автоотзыва", S.fmtSmart(call) + "%"],
        ["Защита на погашении", S.fmtSmart(prot) + "%"],
        ["Наблюдения", obsTxt.charAt(0).toUpperCase() + obsTxt.slice(1)],
        ["Срок", inst.tenor],
        ["Валюта", S.ccyLabel(inst)],
        ["Мин. номинал", S.fmtInt(nom) + " ₽"]
      ],
      exampleIntro: "Вход по номиналу " + S.fmtInt(nom) + " ₽ (100%) · купон " + S.fmt2(cpnPer) + "% за период = " + S.fmtInt(cpnRub) + " ₽",
      scenarios: [
        ["Автоотзыв: все бумаги выше " + S.fmtSmart(call) + "%", "Досрочное погашение — номинал и купон", "+" + S.fmtInt(cpnRub) + " ₽ за период", "var(--up)"],
        ["Корзина выше " + S.fmtSmart(cpnB) + "% весь срок", "Купоны за " + inst.tenor + " и номинал: " + S.fmtInt(holdRub) + " ₽", "+" + S.fmtInt(holdRub - nom) + " ₽", "var(--up)"],
        ["Худшая бумага ниже " + S.fmtSmart(cpnB) + "% на дату наблюдения", "Купон за этот период не начисляется", "0 ₽", "rgba(242,243,247,0.60)"],
        ["На погашении худшая бумага на " + downLvl + "%", "Выплата по перформансу: " + S.fmtInt(downRub) + " ₽", "−" + S.fmtInt(nom - downRub) + " ₽", "var(--loss)"]
      ],
      facts: [
        ["Принцип", "Worst-of — все условия по худшей бумаге корзины"],
        ["Купон", "Условный: " + S.fmt2(cpnPa) + "% годовых при worst-of ≥ " + S.fmtSmart(cpnB) + "%"],
        ["Автоотзыв", "При worst-of ≥ " + S.fmtSmart(call) + "% на дату наблюдения" + (nonCall ? ", начиная с " + (nonCall + 1) + "-й" : "")],
        ["Защита", S.fmtSmart(prot) + "% номинала на погашении (европейский барьер)"],
        ["Риск", "Ниже барьера — выплата по перформансу худшей бумаги"],
        ["Мин. номинал", S.fmtInt(nom) + " ₽"]
      ]
    };
  } else if (inst.type === "revconv") {
    const cpnPa = inst.couponPa != null ? inst.couponPa : inst.quote;
    const K = inst.strike || 100, per = inst.obsPerYear || 4;
    const cpnPer = cpnPa / per, cpnRub = nom * cpnPer / 100;
    const yrs = S.tenorYears(inst) || 1;
    const cpnAll = nom * cpnPa / 100 * yrs;
    const holdRub = nom + cpnAll;
    const be = S.revconvBreakeven(inst);
    // Сценарий просадки — ниже точки, где купон её перекрывает: иначе таблица
    // показывала бы одни плюсы и прятала настоящий риск продукта.
    const downLvl = Math.max(10, Math.round((be != null && be > 0 ? be : K - 30) - 15));
    const bodyPct = S.PAYOFF.revconv(downLvl, K);
    const downRub = nom * bodyPct / 100 + cpnAll;
    const obsTxt = per === 12 ? "ежемесячно" : per === 4 ? "ежеквартально" : per === 2 ? "раз в полгода" : per + " раза в год";
    content = {
      badge: "реверс-конвертибл" + woBadge,
      subtitle: "Реверс-конвертибл · " + inst.underlying + " · купон " + S.fmt2(cpnPa) + "% годовых · страйк " + S.fmtSmart(K) + "%",
      explainer: "Купон " + S.fmt2(cpnPa) + "% годовых выплачивается " + obsTxt + " и не зависит от того, где стоит " + uNom +
        " — это плата за принятый по нему риск. На погашении, если " + uNom + " не ниже страйка " + S.fmtSmart(K) +
        "% начального уровня, возвращается 100% номинала; в росте выше страйка выпуск не участвует. Ниже страйка тело считается по перформансу ОТ СТРАЙКА: " +
        "падение до " + S.fmtSmart(K / 2) + "% даст половину номинала." +
        (K < 100 ? " Страйк ниже старта даёт запас " + S.fmtSmart(100 - K) + " п.п.: пока актив не потерял столько, тело не трогается." : "") +
        " Расчёт денежный — бумаги не поставляются, но экономически это то же самое, как если бы актив был куплен по страйку и остался в портфеле." +
        (be != null && be > 0 ? " Купоны за весь срок покрывают просадку тела примерно до уровня " + S.fmtSmart(be) + "%." : ""),
      payoff: chartPayoff,
      payoffCaption: "Возврат ТЕЛА на погашении в % от номинала; по горизонтали — " + uAxis + " в % от начального. " +
        "Купоны на графике не показаны — они выплачиваются независимо от уровня актива" +

      metrics: [

      scenarios: [

  } else {
    const entryRub = nom * inst.quote / 100;
    const protK = inst.strike || 100;                       // страйк опциона, % от начального уровня
    const protOff = protK - 100;
    const upPct = protOff + 20;
    const payoutUp = nom * S.calc.pct(inst, upPct) / 100;   // calc.pct учитывает страйк
    const partS = Math.round(inst.participation * 100) + "%";
    content = {
      badge: "облигация · защита капитала" + woBadge,
      subtitle: "Облигация с защитой капитала · " + (isWO ? "корзина " : "") + inst.underlying +
        (isWO ? " — участие по худшей бумаге" : "") + " · срок " + inst.tenor +
        (protOff > 0 ? " · участие с роста +" + S.fmtSmart(protOff) + "%" : ""),
      explainer: "Облигация возвращает 100% номинала при любом сценарии — рыночного убытка нет. " +
        (protOff > 0
          ? "Сверху выплачивается " + partS + " роста " + uGen + ", который он покажет ВЫШЕ страйка " + S.fmtSmart(protK) + "% начального уровня: первые " + S.fmtSmart(protOff) + "% роста в выплату не идут."
          : "Если " + uNom + " на дату погашения выше начального уровня S₀, дополнительно выплачивается " + partS + " роста " + uGen + ".") +
        " Если " + (isWO ? "худшая бумага корзины упала" : "актив упал") + " — вы получаете номинал целиком. Купонов нет; результат определяется на дату погашения.",
      payoff: chartPayoff,
      payoffCaption: "Выплата на погашение в % от номинала" + (isWO ? " (по худшей бумаге корзины)" : "") +
        ": не ниже 100% при любом сценарии, выше " +
        (protOff > 0 ? "страйка " + S.fmtSmart(protK) + "%" : "S₀") + " — участие в росте.",
      metrics: [
        ["Цена входа", S.fmt2(inst.quote) + "% ном."],
        ["Защита капитала", S.fmtSmart(inst.protectionPct != null ? inst.protectionPct : 100) + "%"],
        ["Участие в росте", partS],
        ["Страйк опциона", S.fmtSmart(protK) + "%"],
        ["Срок", inst.tenor],
        ["Валюта", S.ccyLabel(inst)],
        ["Мин. номинал", S.fmtInt(nom) + " ₽"]
      ],
      exampleIntro: "Номинал " + S.fmtInt(nom) + " ₽ · вход по " + S.fmt2(inst.quote) + "% = " + S.fmtInt(entryRub) + " ₽",
      scenarios: [
        [uGrew + " на " + S.fmtSmart(upPct) + "%", "Выплата " + S.fmtInt(payoutUp) + " ₽ — 100% + участие", "+" + S.fmtInt(payoutUp - entryRub) + " ₽", "var(--up)"],
        [uFell + " на 15%", "Сработала защита: выплата " + S.fmtInt(nom) + " ₽", "0 ₽", "rgba(242,243,247,0.60)"]
      ],
      facts: (isWO ? [woFact] : []).concat([
        ["Защита", "100% номинала при любом сценарии"],
        ["Участие", partS + " роста" + (protOff > 0 ? " выше страйка " + S.fmtSmart(protK) + "%" : " базового актива") + ", без потолка"],
        ["Купоны", "Нет — результат на дату погашения"],
        ["Стиль", "Европейский — выплата на дату погашения"],
        ["Риск", "Кредитный риск эмитента облигации"],
        ["Мин. номинал", S.fmtInt(nom) + " ₽"]
      ])
    };
  }

  // --- Рендер ---
  const boardLink = document.getElementById("crumb-board");
  boardLink.textContent = t.title;
  boardLink.href = "board.html?type=" + inst.type;
  document.getElementById("crumb-id").textContent = S.displayName(inst);
  document.getElementById("title").textContent = S.displayName(inst);
  document.getElementById("onepager-link").href = "onepager.html?id=" + encodeURIComponent(inst.id) + "&print=1";
  if (window.Contact) Contact.attach(document.getElementById("ct-host"), { title: S.displayName(inst), url: location.href, id: inst.id });
  // «Поделиться» отдаёт /p/<id> — лёгкую страницу с персональным og-превью (как на доске),
  // чтобы сейлз, скопировавший адрес из карточки, слал не обезличенную обложку (A.7).
  if (window.Share) {
    var prodUrl = new URL("p/" + encodeURIComponent(inst.id), location.href).href;
    Share.attach(document.getElementById("sh-host"), { url: prodUrl, title: S.displayName(inst), name: S.displayName(inst), pitch: content.subtitle, params: (content.metrics || []) });
  }
  document.getElementById("badge").textContent = content.badge;
  document.getElementById("subtitle").textContent = content.subtitle;
  document.getElementById("quote").innerHTML = S.quoteBig(inst.quote);
  document.getElementById("quote-sub").textContent = inst.type === "booster" ? "коэффициент участия · индикативно"
    : (inst.type === "autocall" || inst.type === "revconv") ? "купон · % годовых · индикативно"
    : "котировка · индикативно · % от номинала · " + (inst.currency || "RUB");
  // «Изменение за день» дублируется в шапке (quote-chg) и в метриках. У всех
  // инструментов chg===0 (рынок в котировках не отражаем), а на дисконтных 2-я
  // ветка знака печатала «−0,0 п.п.» — минус на нуле. Пока данных о дневном
  // движении нет, дневную дельту не показываем вовсе — честнее пустого поля.
  const chgEl = document.getElementById("quote-chg");
  if (inst.chg) {
    chgEl.textContent = (inst.chg > 0 ? "+" : "−") + S.fmt1(Math.abs(inst.chg)) + " п.п. сегодня";
    chgEl.style.color = inst.chg > 0 ? "var(--up)" : "var(--loss)";
  } else {
    chgEl.style.display = "none";
  }
  content.metrics = content.metrics.filter(m => !(m[0] === "Изм. за день" && !inst.chg));

  document.getElementById("metrics").innerHTML = content.metrics.map(m =>
    '<div class="metric"><span class="k">' + m[0] + '</span><span class="v">' + m[1] + '</span></div>').join("");

  document.getElementById("example-intro").textContent = content.exampleIntro;
  document.getElementById("scenarios").innerHTML = content.scenarios.map(s =>
    '<div class="scenario"><div class="l">' + s[0] + '</div><div class="d">' + s[1] + '</div><div class="r" style="color:' + s[3] + '">' + s[2] + '</div></div>').join("") +
    (S.isFxSensitive(inst.underlying) ? '<div style="margin-top:12px;padding:9px 13px;border-left:3px solid #EE7D1B;background:rgba(238,125,27,0.12);border-radius:0 7px 7px 0;font-size:12.5px;line-height:1.5;color:#E7B98D">' + S.LEGAL.fx + '</div>' : '');

  document.getElementById("explainer").textContent = content.explainer;
  document.getElementById("facts").innerHTML = content.facts.map(f =>
    '<div class="fact"><div class="k">' + f[0] + '</div><div class="v">' + f[1] + '</div></div>').join("");

  // Дисклеймер: на эту страницу ведут ВСЕ шаринг-ссылки (p/<id> → instrument.html),
  // а юридической оговорки тут не было — она приходила только из подвала чат-виджета.
  document.getElementById("disclaimer").textContent =
    S.LEGAL.iir + " Котировки индикативны. Пример расчёта иллюстративный, без учёта комиссий и налогов. Продукт доступен только квалифицированным инвесторам.";

  // --- Калькулятор выплаты (математика — в data/lib.js S.calc, общая с доской) ---
  function calcInner(inst) {
    const nom0 = inst.minNom || 1000000;
    const atPar = inst.type === "booster" || inst.type === "autocall" || inst.type === "revconv";   // вход по номиналу, не по премии
    const price0 = atPar ? nom0 : Math.round(nom0 * inst.quote / 100), cfg = S.calc.move(inst);
    const slider = cfg ? '<div class="calc-row"><label class="calc-l">' + inst.underlying + ': <b id="calc-mv"></b></label>' +
      '<input class="calc-range" id="calc-move" type="range" min="' + cfg.min + '" max="' + cfg.max + '" value="' + cfg.val + '" step="1" aria-label="Сценарий по базовому активу"></div>' : '';
    return '<div class="calc-row"><label class="calc-l" for="calc-amt">Сумма вложения, ₽</label>' +
        '<input class="calc-input" id="calc-amt" type="number" inputmode="numeric" min="0" max="1000000000" step="1000" value="' + price0 + '"></div>' +
      slider +
      '<div class="calc-out"><div class="calc-o"><div class="v" id="calc-payout"></div><div class="k">выплата при погашении</div></div>' +
        '<div class="calc-o"><div class="v" id="calc-net"></div><div class="k">результат</div></div></div>' +
      '<div class="calc-note" id="calc-note"></div>';
  }
  function wireCalc(inst) {
    const amt = document.getElementById("calc-amt"); if (!amt) return;
    const move = document.getElementById("calc-move"), mvOut = document.getElementById("calc-mv");
    const payoutEl = document.getElementById("calc-payout"), netEl = document.getElementById("calc-net"), noteEl = document.getElementById("calc-note");
    const prot = inst.protectionPct || 100;
    const MAX_AMT = 1e9;
    function run() {
      // Клемп суммы: отрицательное → 0, свыше 1 млрд → 1 млрд, мусор/экспонента → 0.
      const raw = parseFloat(amt.value);
      let amount = raw, clampNote = "";
      if (!isFinite(amount) || amount < 0) { amount = 0; if (raw < 0) clampNote = "Сумма не может быть отрицательной. "; }
      else if (amount > MAX_AMT) { amount = MAX_AMT; clampNote = "Максимум для расчёта — 1 млрд ₽. "; }
      const nominal = (inst.type === "booster" || inst.type === "autocall" || inst.type === "revconv") ? amount : (inst.quote ? amount * 100 / inst.quote : 0);
      const m = move ? +move.value : 0;
      if (mvOut) mvOut.textContent = (m >= 0 ? "+" : "") + m + "%";
      const payout = nominal * S.calc.pct(inst, m) / 100, net = payout - amount;
      payoutEl.textContent = S.fmtInt(Math.round(payout)) + " ₽";
      netEl.textContent = (net >= 0 ? "+" : "−") + S.fmtInt(Math.round(Math.abs(net))) + " ₽";
      netEl.style.color = net >= 0 ? "var(--up)" : "var(--loss)";
      const be = S.calc.breakeven(inst);
      if (inst.type === "warrant") noteEl.textContent = clampNote + "Экспозиция на номинал " + S.fmtInt(Math.round(nominal)) + " ₽ за премию = сумму вложения. Безубыток — при росте " + inst.underlying + " примерно на +" + S.fmtSmart(be) + "%; ниже — выплата не покрывает премию.";
      else if (inst.type === "protection") noteEl.textContent = clampNote + "Номинал " + S.fmtInt(Math.round(nominal)) + " ₽. Защита " + prot + "%: при падении возвращается " + prot + "% номинала.";
      else if (inst.type === "booster") noteEl.textContent = clampNote + "Вложение = номинал " + S.fmtInt(Math.round(nominal)) + " ₽. Рост ×КУ внутри диапазона до потолка; при падении — участие 1:1, как в самом активе.";
      else if (inst.type === "revconv") noteEl.textContent = clampNote + "Вложение = номинал " + S.fmtInt(Math.round(nominal)) + " ₽. Показан возврат ТЕЛА на погашении — БЕЗ купонов: они выплачиваются отдельно и от уровня актива не зависят. На страйке " + S.fmtSmart(inst.strike || 100) + "% и выше возвращается весь номинал, ниже — по перформансу от страйка.";
      else if (inst.type === "autocall") noteEl.textContent = clampNote + "Вложение = номинал " + S.fmtInt(Math.round(nominal)) + " ₽. Показан возврат ТЕЛА на погашении по худшей бумаге корзины — БЕЗ купонов: они начисляются отдельно на датах наблюдения. Выше " + S.fmtSmart(inst.protectionPct || 65) + "% возвращается весь номинал.";
      else noteEl.textContent = clampNote + "Номинал " + S.fmtInt(Math.round(nominal)) + " ₽. При погашении — 100% номинала (если нет кредитного события). Доход зафиксирован дисконтом.";
    }
    amt.addEventListener("input", run);
    if (move) move.addEventListener("input", run);
    run();
  }
  if (inst.quote != null) { document.getElementById("calc-mount").innerHTML = calcInner(inst); wireCalc(inst); }
  else document.getElementById("calc-section").style.display = "none";

  function setMode(m) {
    mode = m;
    const tp = document.getElementById("tab-payoff"), tu = document.getElementById("tab-under");
    tp.className = "tab" + (m === "payoff" ? " active" : ""); tp.setAttribute("aria-selected", m === "payoff");
    tu.className = "tab" + (m === "under" ? " active" : ""); tu.setAttribute("aria-selected", m === "under");
    document.getElementById("chart-title").textContent = m === "payoff" ? "Диаграмма выплат" : "Базовый актив — " + inst.underlying;
    const cap = m === "payoff" ? content.payoffCaption : U.desc + " Динамика за 12 месяцев; данные — демо.";
    document.getElementById("chart-caption").textContent = cap;
    // SVG без текстовой альтернативы (WCAG 1.1.1) → контейнер role=img + подпись
    const chartEl = document.getElementById("chart");
    chartEl.innerHTML = m === "payoff" ? content.payoff() : chartUnderlying();
    chartEl.setAttribute("role", "img");
    chartEl.setAttribute("aria-label", (m === "payoff" ? "Диаграмма выплат. " : "График базового актива. ") + cap);
  }
  // Вкладки графика: слушатели, а не inline onclick — setMode живёт внутри блока
  document.getElementById("tab-payoff").addEventListener("click", () => setMode("payoff"));
  document.getElementById("tab-under").addEventListener("click", () => setMode("under"));
  if (!U) document.querySelector(".tabs").style.display = "none";
  setMode("payoff");
  }
</script>
<script src="chat.js?v=17"></script>
<script src="search.js?v=1"></script>
<script src="nav-about.js?v=6"></script>
<script src="qualgate.js?v=5"></script>
