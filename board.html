<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Текущие продукты — структурные продукты</title>
<meta name="description" content="Текущие продукты: котировки в процентах от номинала, диаграммы выплат и параметры по каждому инструменту.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Rumberg">
<meta property="og:locale" content="ru_RU">
<meta property="og:title" content="Текущие продукты — структурные продукты">
<meta property="og:description" content="Котировки в процентах от номинала, диаграммы выплат и параметры по каждому инструменту.">
<meta property="og:url" content="https://invest.rumberg.ru/board.html">
<link rel="canonical" href="https://invest.rumberg.ru/board.html">
<meta property="og:image" content="https://invest.rumberg.ru/og-cover.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Rumberg — структурные продукты">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0B0C10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Rubik:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --canvas: #0B0C10; --card: #14161C; --panel-2: #191B22; --tile: rgba(255,255,255,0.045);
    --black: #1A1919;
    --ink: #F2F3F7; --hushed: rgba(242,243,247,0.64); --faint: rgba(242,243,247,0.56);
    --border: rgba(255,255,255,0.11); --border-soft: rgba(255,255,255,0.07);
    --solar: #EE7D1B; --solar-l: #F58E33;
    --spruce: #5E9B82; --steel: #4F86E6; --amber: #E0A24A;
    --up: #55C08A; --down: #E0705A; --loss: #E0705A;
    --f-body: 'Onest', system-ui, sans-serif;
    --f-mono: 'JetBrains Mono', Consolas, monospace;
    --display: 'Rubik', 'Onest', system-ui, sans-serif;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--canvas); color: var(--ink); font-family: var(--f-body); -webkit-font-smoothing: antialiased; }
  a { text-decoration: none; color: inherit; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 4px; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 44px 40px; }

  .nav { position: sticky; top: 0; z-index: 20; background: rgba(11,12,16,0.82); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
  .nav-in { max-width: 1280px; margin: 0 auto; padding: 0 44px; height: 62px; display: flex; align-items: center; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-name { font-size: 14.5px; font-weight: 600; }
  .topnav { margin-left: auto; display: flex; align-items: center; gap: 22px; font-size: 14px; font-weight: 500; }
  .topnav a { color: var(--hushed); transition: color .2s; }
  .topnav a:hover { color: var(--ink); }
  .topnav a[aria-current="page"] { color: var(--ink); font-weight: 600; }
  .btn-solar { background: var(--solar); color: #0C0A08 !important; border-radius: 6px; padding: 8px 14px; display: inline-flex; align-items: center; gap: 7px; transition: background .3s ease-in-out; }
  .btn-solar:hover { background: var(--solar-l); }

  /* ── Полоса под шапкой: синусоида-фон + лента мотивирующих фраз ── */
  .ticker { position: relative; height: 54px; overflow: hidden; background: #101114; border-bottom: 1px solid #23242B; }
  .ticker svg.tk-sine { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
  .tk-rot { position: absolute; inset: 0; z-index: 2; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .tk-rot span { position: absolute; font-family: var(--f-body); font-size: 14.5px; color: var(--ink); opacity: 0; transition: opacity .6s ease; text-align: center; padding: 0 20px; letter-spacing: -0.005em; }
  .tk-rot span.on { opacity: 1; }

  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin: 26px 0 18px; }
  h1 { margin: 0; font-family: var(--display); font-size: 30px; font-weight: 400; letter-spacing: -0.02em; line-height: 1.1; }
  .count { font-family: var(--f-mono); font-size: 12px; color: var(--hushed); }

  .layout { display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 20px; align-items: start; }

  /* ── Список слева ── */
  .aside { position: sticky; top: 78px; display: flex; flex-direction: column; max-height: calc(100dvh - 100px); }
  .controls { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
  .search { width: 100%; border: 1px solid var(--border); border-radius: 6px; background: var(--card); padding: 10px 12px; font-family: var(--f-body); font-size: 16px; color: var(--ink); }
  .search::placeholder { color: var(--faint); }
  .search:focus { outline: 2px solid var(--ink); outline-offset: 1px; }
  .chips { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .kf { border: 1px solid var(--border); background: var(--card); border-radius: 6px; padding: 6px 12px; font-size: 12.5px; font-weight: 500; color: var(--hushed); cursor: pointer; font-family: var(--f-body); }
  .kf:hover { color: var(--ink); }
  .kf.active { background: rgba(238,125,27,0.16); border-color: var(--solar); color: var(--ink); font-weight: 600; }
  .kf .n { font-family: var(--f-mono); font-size: 11px; opacity: 0.75; margin-left: 4px; }

  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .list-top { display: flex; justify-content: flex-end; margin: -2px 0 8px; }
  .ta { border: none; background: transparent; padding: 2px 2px; font-family: var(--f-body); font-size: 12.5px; font-weight: 500; color: var(--hushed); cursor: pointer; }
  .ta:hover { color: var(--ink); }

  .list { background: var(--card); border: 1px solid var(--border-soft); border-radius: 12px; overflow-y: auto; flex: 1; min-height: 0; }
  .group-h { display: flex; align-items: center; gap: 9px; width: 100%; border: none; border-top: 1px solid var(--border-soft); background: var(--panel-2); cursor: pointer; font-family: var(--f-body); color: var(--ink); padding: 11px 14px; text-align: left; position: sticky; top: 0; z-index: 2; }
  .group-h:first-child { border-top: none; }
  .group-h .chev { transition: transform .2s var(--ease); color: var(--hushed); font-size: 11px; }
  .group-h.open .chev { transform: rotate(90deg); }
  .group-h .name { font-size: 13.5px; font-weight: 600; }
  .group-h .gc { margin-left: auto; font-family: var(--f-mono); font-size: 11px; color: var(--hushed); white-space: nowrap; }
  .group-items { display: none; }
  .group-items.open { display: block; }
  .item { display: block; width: 100%; text-align: left; border: none; border-top: 1px solid rgba(255,255,255,0.07); border-left: 3px solid transparent; background: transparent; cursor: pointer; font-family: var(--f-body); color: var(--ink); padding: 10px 14px 10px 12px; }
  .item:hover { background: rgba(255,255,255,0.05); }
  .item.active { background: rgba(255,255,255,0.05); border-left-color: var(--solar); }
  .item .r1 { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .item .nm { font-size: 13.5px; font-weight: 600; }
  .item .q { font-family: var(--f-mono); font-size: 12px; white-space: nowrap; }
  .empty-list { padding: 22px 14px; font-size: 13px; color: var(--faint); }

  /* ── Сравнение продуктов ────────────────────────────────────────────────
     Режим: чипс «Сравнить» в фильтрах → в списке появляются галочки, клик по
     пункту добавляет/убирает продукт (до 3), при 2+ панель показывает сравнение. */
  .cmp-chip { border: 1px solid var(--border); background: var(--card); border-radius: 20px; padding: 6px 13px; font-family: var(--f-body); font-size: 12.5px; color: var(--hushed); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .cmp-chip:hover { color: var(--ink); }
  .cmp-chip.on { background: rgba(238,125,27,0.16); color: var(--ink); border-color: var(--solar); }
  /* галочка перед названием — только в режиме сравнения */
  .list.cmp .item { padding-left: 12px; }
  .item .ck { display: none; flex: none; width: 15px; height: 15px; margin-right: 9px; border: 1px solid var(--border); border-radius: 4px; position: relative; top: 2px; }
  .list.cmp .item .ck { display: inline-block; }
  .item.picked .ck { background: var(--solar); border-color: var(--solar); }
  .item.picked .ck::after { content: "✓"; position: absolute; inset: 0; color: #0C0A08; font-size: 11px; font-weight: 700; line-height: 15px; text-align: center; }
  .item.picked { background: rgba(238,125,27,0.10); }
  .list.cmp .item .r1 { align-items: flex-start; }
  /* полоска состояния под списком */
  .cmp-bar { display: none; align-items: center; gap: 10px; margin-top: 8px; padding: 9px 12px; background: var(--card); border: 1px solid var(--solar); border-radius: 10px; font-size: 12.5px; color: var(--hushed); }
  .cmp-bar.on { display: flex; }
  .cmp-bar .cnt { font-family: var(--f-mono); color: var(--ink); }
  .cmp-bar .rst { margin-left: auto; border: none; background: transparent; padding: 0; font-family: var(--f-body); font-size: 12.5px; color: var(--solar); cursor: pointer; }
  .cmp-bar .rst:hover { color: var(--solar-l); }

  /* таблица сравнения */
  .cmp-head { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 4px; }
  .cmp-h1 { font-family: var(--display); font-size: 21px; font-weight: 400; letter-spacing: -0.01em; }
  .cmp-scroll { overflow-x: auto; margin: 14px -2px 0; }
  .cmp-tbl { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 420px; }
  .cmp-tbl th, .cmp-tbl td { padding: 9px 12px; border: 1px solid var(--border-soft); vertical-align: top; text-align: left; }
  .cmp-tbl thead th { background: var(--panel-2); font-weight: 600; font-size: 13px; line-height: 1.3; }
  .cmp-tbl thead th .tp { display: block; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); margin-top: 4px; font-weight: 400; }
  .cmp-tbl tbody th { font-weight: 400; color: var(--hushed); background: var(--card); white-space: nowrap; }
  /* первая колонка залипает — на телефоне видно, какой это параметр */
  .cmp-tbl th:first-child, .cmp-tbl td:first-child { position: sticky; left: 0; z-index: 1; }
  .cmp-tbl thead th:first-child { background: var(--panel-2); }
  .cmp-tbl tr.diff td { background: rgba(238,125,27,0.06); }
  .cmp-tbl td .mono { font-family: var(--f-mono); }
  .cmp-legend { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-top: 12px; font-size: 12px; color: var(--hushed); }
  .cmp-legend .lg { display: inline-flex; align-items: center; gap: 6px; }
  .cmp-legend .sw { width: 13px; height: 3px; border-radius: 2px; flex: none; }
  .cmp-diffnote { margin-top: 10px; font-size: 11.5px; color: var(--faint); }
  /* результаты общего калькулятора по продуктам */
  .cmp-res { display: grid; gap: 10px; margin-top: 12px; }
  .cmp-r { background: var(--card); border: 1px solid var(--border-soft); border-radius: 9px; padding: 11px 13px; display: flex; align-items: baseline; gap: 12px; }
  .cmp-r .nm { font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 7px; min-width: 0; }
  .cmp-r .nm .sw { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .cmp-r .vals { margin-left: auto; display: flex; align-items: baseline; gap: 14px; white-space: nowrap; }
  .cmp-r .pay { font-family: var(--f-mono); font-size: 13px; color: var(--hushed); }
  .cmp-r .net { font-family: var(--f-mono); font-size: 15px; font-weight: 600; }
  @media (max-width: 560px) {
    .cmp-r { flex-wrap: wrap; }
    .cmp-r .vals { margin-left: 0; width: 100%; justify-content: space-between; }
  }

  /* ── Паспорт справа ── */
  .panel-wrap { position: sticky; top: 78px; }
  .panel { background: var(--card); border: 1px solid var(--border-soft); border-radius: 12px; padding: 26px 28px; max-height: calc(100dvh - 100px); overflow-y: auto; }
  .panel-close { display: none; }

  .pp-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; flex-wrap: wrap; }
  .pp-title { font-family: var(--display); font-size: 23px; font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; }
  /* Все действия — в строке с названием, как на размещённых выпусках: вниз за ними
     не идут. Кегль «Обсудить» мельче базового — рядом с 23-м заголовком
     полноразмерная кнопка спорит с ним за внимание. */
  .pp-title-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .pp-title-row .pp-actions { margin-top: 0; }
  .pp-title-row .ct-btn { padding: 8px 14px; font-size: 13px; }
  .badge { display: inline-block; margin-top: 7px; font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink); background: rgba(255,255,255,0.08); border-radius: 6px; padding: 3px 8px; }
  .pp-sub { margin-top: 8px; font-size: 13px; color: var(--hushed); max-width: 480px; }
  /* Котировка в паспорте — ВСЕГДА на своей строке и по левому краю, в одну линию
     с бейджем, подзаголовком и кнопками. Раньше блок переносился «как получится»
     (зависело от длины названия): у длинных имён он падал вниз и с text-align:right
     выглядел висящим по центру, у коротких — оставался справа. flex-basis:100%
     убирает эту зависимость: перенос гарантирован для всех продуктов. */
  .quote-block { flex: 0 0 100%; text-align: left; margin-top: 2px; }
  .quote-big { font-family: var(--f-mono); font-size: 30px; font-weight: 500; letter-spacing: -0.02em; }
  .quote-big .q-dec { font-size: 0.6em; }
  .quote-sub { font-size: 11.5px; color: var(--faint); margin-top: 2px; }

  .chart-box { margin-top: 18px; border: 1px solid rgba(255,255,255,0.07); border-radius: 10px; padding: 14px 16px 10px; }
  .chart-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .chart-title { font-size: 13.5px; font-weight: 600; }
  .tabs { display: flex; gap: 4px; background: rgba(255,255,255,0.06); border-radius: 8px; padding: 3px; }
  .tab { border: none; border-radius: 6px; padding: 5px 13px; font-size: 12.5px; font-weight: 500; cursor: pointer; background: transparent; color: var(--hushed); font-family: var(--f-body); }
  .tab.active { font-weight: 600; background: #262A33; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.35); }
  .chart-caption { margin-top: 8px; font-size: 11.5px; line-height: 1.5; color: var(--faint); }

  .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
  .metric { background: var(--tile); border-radius: 8px; padding: 10px 12px; }
  .metric .v { font-family: var(--f-mono); font-size: 13.5px; }
  .metric .k { margin-top: 3px; font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--faint); }

  .sec { margin-top: 20px; }
  .sec .h { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--hushed); padding-bottom: 8px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
  .sec .intro { font-size: 13px; color: var(--hushed); margin: 8px 0 2px; }
  .scenario { display: grid; grid-template-columns: 1.3fr 1.3fr 0.6fr; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.07); }
  .scenario .l { font-size: 13.5px; font-weight: 600; }
  .scenario .d { font-size: 12.5px; color: var(--hushed); }
  .scenario .r { text-align: right; font-family: var(--f-mono); font-size: 13.5px; }
  .explainer { font-size: 13.5px; line-height: 1.65; color: var(--hushed); margin: 10px 0 0; text-wrap: pretty; }
  .facts { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 14px; }
  .fact { min-width: 140px; max-width: 220px; }
  .fact .k { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 3px; }
  .fact .v { font-size: 13px; line-height: 1.45; }

  /* Действия — сразу над диаграммой (вниз не долистывают). Один акцент: «Обсудить
     продукт» оранжевая, one-pager и «Поделиться» — тихие, без рамок. */
  .pp-actions { margin-top: 16px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .pp-actions .btn-pdf.btn-secondary { border: none !important; background: transparent !important; color: var(--hushed) !important; padding: 8px 10px; transition: color .2s; }
  .pp-actions .btn-pdf.btn-secondary:hover { color: var(--ink) !important; background: rgba(255,255,255,0.05) !important; }
  .pp-actions .sh-btn { border-color: transparent; color: var(--hushed); padding: 8px 10px; }
  .pp-actions .sh-btn:hover { border-color: transparent; color: var(--ink); background: rgba(255,255,255,0.05); }
  .btn-pdf { display: inline-flex; align-items: center; gap: 8px; background: var(--solar); color: var(--ink); border-radius: 6px; padding: 9px 16px; font-size: 13.5px; font-weight: 500; transition: background .3s ease-in-out; }
  .btn-pdf:hover { background: var(--solar-l); }
  .btn-secondary { background: transparent !important; color: var(--ink) !important; border: 1px solid var(--border); }
  .btn-secondary:hover { background: rgba(255,255,255,0.06) !important; }
  .btn-secondary svg path { stroke: var(--ink) !important; }
  .placeholder { display: grid; place-items: center; min-height: 300px; color: var(--faint); font-size: 14px; }
  .disclaimer { margin-top: 20px; font-size: 12px; line-height: 1.5; color: var(--faint); }

  .calc { background: var(--tile); border: 1px solid var(--border-soft); border-radius: 10px; padding: 15px 16px; }
  .calc-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 13px; }
  .calc-l { font-size: 13px; color: var(--hushed); }
  .calc-l b { color: var(--ink); font-family: var(--f-mono); font-weight: 500; }
  .calc-input { width: 150px; background: var(--card); border: 1px solid var(--border); border-radius: 7px; padding: 8px 11px; color: var(--ink); font-family: var(--f-mono); font-size: 16px; text-align: right; }
  .calc-input:focus { outline: 2px solid var(--solar); outline-offset: 1px; }
  .calc-range { flex: 1; max-width: 58%; accent-color: var(--solar); cursor: pointer; }
  .calc-out { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 2px; }
  .calc-o { background: var(--card); border: 1px solid var(--border-soft); border-radius: 8px; padding: 11px 13px; }
  .calc-o .v { font-family: var(--f-mono); font-size: 19px; font-weight: 600; letter-spacing: -0.01em; }
  .calc-o .k { font-size: 11px; color: var(--faint); margin-top: 3px; }
  .calc-note { margin-top: 11px; font-size: 11.5px; line-height: 1.45; color: var(--faint); }

  @media (max-width: 900px) {
    /* нижний воздух, чтобы последние строки списка прокручивались выше AI-орба (56px @ bottom:20) */
    .wrap { padding: 0 16px 96px; }
    /* пока открыт полноэкранный паспорт — орб (z-300) прячем, иначе он поверх CTA */
    body:has(.panel-wrap.open) .ca-btn, body:has(.panel-wrap.open) .ca-panel { display: none; }
    .layout { grid-template-columns: 1fr; }
    .aside { position: static; max-height: none; }
    .list { max-height: none; }
    .panel-wrap { display: none; position: fixed; inset: 0; z-index: 40; background: var(--canvas); padding: 14px; overflow-y: auto; overflow-x: hidden; }
    .panel-wrap.open { display: block; }
    /* .panel не должен быть своим скролл-контекстом (overflow-y:auto → overflow-x:auto
       давал паразитный горизонтальный скролл от закрытых absolute-попапов на 320px).
       На мобиле вертикально скроллит .panel-wrap. */
    .panel { max-height: none; overflow: visible; }
    .panel-close { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 12px; border: 1px solid var(--border); background: var(--card); border-radius: 6px; padding: 8px 14px; font-family: var(--f-body); font-size: 13.5px; cursor: pointer; }
    .metrics { grid-template-columns: repeat(2, 1fr); }
    .scenario { grid-template-columns: 1fr; gap: 3px; }
    .scenario .r { text-align: left; }
  }

<script>
  const S = window.SITE;
  const TYPE_LABEL = { discount: "Дисконтные облигации", protection: "Защита капитала", warrant: "Варранты", booster: "Бустеры", autocall: "Автоколлы" };

  let type = "all", q = "", selected = null, mode = "payoff";
  // Храним СВЁРНУТЫЕ группы: по умолчанию раскрыты все. Раньше здесь был набор
  // раскрытых — доска открывалась с нулём видимых инструментов из 38.
  const closedGroups = new Set();

  // ?type= из старых ссылок предвыбирает семейство
  const qsType = new URLSearchParams(location.search).get("type");
  if (S.TYPES[qsType]) type = qsType;

  // --- Графики (SVG строками, Ramp-палитра) ---
  const W = 560, H = 270, PAD = 26;
  const MONO = 'font-family="JetBrains Mono, monospace"';
  const C = { line: "#E7E9F0", gold: "#EE7D1B", grid: "rgba(255,255,255,0.09)", axis: "rgba(255,255,255,0.17)", lab: "rgba(255,255,255,0.46)", lab2: "rgba(255,255,255,0.68)" };

  function chartUnderlying(inst, U) {
    const data = U.history;
    const PADL = 56, PADR = 26, PADT = 24, PADB = 40;
    const min = Math.min(...data), max = Math.max(...data), rng = (max - min) || 1;
    const x = i => PADL + (i / (data.length - 1)) * (W - PADL - PADR);
    const y = v => PADT + (1 - (v - min) / rng) * (H - PADT - PADB);
    const pts = data.map((v, i) => [x(i), y(v)]);
    const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
    const area = line + " L" + x(data.length - 1).toFixed(1) + " " + (H - PADB) + " L" + PADL + " " + (H - PADB) + " Z";
    let grid = "";
    for (let g = 0; g <= 3; g++) {
      const val = max - (g / 3) * (max - min);
      const gy = y(val);
      grid += '<line x1="' + PADL + '" y1="' + gy.toFixed(1) + '" x2="' + (W - PADR) + '" y2="' + gy.toFixed(1) + '" stroke="' + C.grid + '" stroke-width="1"/>' +
        '<text x="' + (PADL - 7) + '" y="' + (gy + 4).toFixed(1) + '" text-anchor="end" fill="' + C.lab + '" font-size="10" ' + MONO + '>' + S.fmtSmart(val) + '</text>';
    }
    const MONTHS = ["янв", "фев", "мар", "апр", "май", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];
    const now = new Date();
    let xlab = "";
    for (let i = 0; i < data.length; i++) {
      if ((data.length - 1 - i) % 2) continue;
      const d = new Date(now.getFullYear(), now.getMonth() - (data.length - 1 - i), 1);
      xlab += '<text x="' + x(i).toFixed(1) + '" y="' + (H - PADB + 18) + '" text-anchor="middle" fill="' + C.lab + '" font-size="10" ' + MONO + '>' + MONTHS[d.getMonth()] + '</text>';
    }
    const axes = '<line x1="' + PADL + '" y1="' + (H - PADB) + '" x2="' + (W - PADR) + '" y2="' + (H - PADB) + '" stroke="' + C.axis + '" stroke-width="1"/>' +
      '<line x1="' + PADL + '" y1="' + PADT + '" x2="' + PADL + '" y2="' + (H - PADB) + '" stroke="' + C.axis + '" stroke-width="1"/>' +
      '<text x="' + (PADL - 7) + '" y="13" text-anchor="end" fill="' + C.lab + '" font-size="10" ' + MONO + '>' + (U.unit || "") + '</text>';
    const last = pts[pts.length - 1];
    const label = inst.uRef || (S.fmtSmart(data[data.length - 1]) + (U.unit ? " " + U.unit : ""));
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" style="display:block">' + grid + axes + xlab +
      '<defs><linearGradient id="fillu" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="' + C.line + '" stop-opacity="0.10"/><stop offset="100%" stop-color="' + C.line + '" stop-opacity="0"/></linearGradient></defs>' +
      '<path d="' + area + '" fill="url(#fillu)"/>' +
      '<path d="' + line + '" fill="none" stroke="' + C.line + '" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<circle cx="' + last[0] + '" cy="' + last[1] + '" r="4" fill="' + C.line + '"/>' +
      '<text x="' + (W - PADR) + '" y="' + (last[1] - 11) + '" text-anchor="end" fill="' + C.line + '" font-size="11" ' + MONO + '>' + label + '</text>' +
      '</svg>';
  }

  // Графики выплат — общие с доской, живут в data/lib.js. Пока копия была
  // на каждой странице, оси у типов продуктов назывались по-своему и нуля
  // на них не было видно (правка по фидбеку 10.08.2026).
  // На узком экране viewBox уже, поэтому кегль подписей задаём крупнее: иначе
  // 11px внутри 620-й системы координат сжимаются до нечитаемых ~5px.
  const chOpt = () => (window.innerWidth < 620
    ? { W: 380, H: 280, colors: C, padL: 50, padR: 14, padT: 18, padB: 46, font: 13, xCount: 3, yCount: 3 }
    : { W: W, H: H, colors: C, padL: 56, padR: 26, padT: 20, padB: 48 });
  const chartPayoff = (r) => (r.type === "discount" ? S.discountChart(r, chOpt()) : S.payoffChart(r, chOpt()));

  // --- Контент паспорта (без дублей: котировка и изменение — только в шапке) ---
  function buildContent(inst) {
    const nom = inst.minNom;
    if (inst.type === "warrant") {
      const isCS = inst.structure === "cs";
      const K = inst.strike, K2 = inst.strike2;
      const premiumRub = nom * inst.quote / 100;
      const spot = inst.spot || 100;
      const strikeTxt = "Страйк — " + S.fmtSmart(K) + "% уровня базового актива в день покупки" + (K > 100 ? " (на " + S.fmtSmart(K - 100) + "% выше)" : "") + ".";
      const upPct = Math.max(16, Math.ceil((inst.quote + 6) / 5) * 5);
      const payout1 = nom * S.PAYOFF.pct(spot * (1 + upPct / 100), K, K2) / 100;
      const net1 = payout1 - premiumRub;
      const capPct = isCS ? (K2 - K) : 0;
      const capRub = nom * capPct / 100;
      const metrics = isCS
        ? [[S.fmtSmart(K) + "%", "страйк (K)"], [S.fmtSmart(K2) + "%", "потолок (K₂)"], [inst.tenor, "срок"], [S.fmt2(inst.quote) + "% ном.", "цена входа"], [inst.currency || "RUB", "валюта"]]
        : [[S.fmtSmart(K) + "%", "страйк (K)"], [inst.tenor, "срок"], [S.fmt2(inst.quote) + "% ном.", "цена входа"], [inst.currency || "RUB", "валюта"], [inst.underlying, "базовый актив"]];
      const scen = [
        [inst.underlying + " вырос на " + upPct + "%", "Выплата " + S.fmtInt(payout1) + " ₽", (net1 >= 0 ? "+" : "−") + S.fmtInt(Math.abs(net1)) + " ₽", net1 >= 0 ? "var(--up)" : "var(--loss)"]
      ];
      if (isCS) {
        const capNet = capRub - premiumRub;
        scen.push([inst.underlying + " вырос на 70% — выше потолка", "Выплата " + S.fmtInt(capRub) + " ₽ — максимум", (capNet >= 0 ? "+" : "−") + S.fmtInt(Math.abs(capNet)) + " ₽", capNet >= 0 ? "var(--up)" : "var(--loss)"]);
      }
      scen.push([inst.underlying + " не вырос", "Выплаты нет", "−" + S.fmtInt(premiumRub) + " ₽", "var(--loss)"]);
      return {
        badge: isCS ? "КОЛЛ-СПРЕД · ВАРРАНТ" : "CALL · ВАРРАНТ",
        subtitle: (isCS ? "Колл-спред на рост " : "Варрант на рост ") + inst.underlying + " — риск ограничен уплаченной премией",
        payoff: () => chartPayoff(inst),
        payoffCaption: isCS
          ? "Выплата на экспирацию в % от номинала; уровень БА — в % от начального. Выше K₂ выплата не растёт. Пунктир — премия; б/у — безубыточность."
          : "Выплата на экспирацию в % от номинала; уровень БА — в % от начального. Пунктир — премия; б/у — безубыточность.",
        metrics,
        exampleIntro: "Номинал " + S.fmtInt(nom) + " ₽ · премия " + S.fmt2(inst.quote) + "% = " + S.fmtInt(premiumRub) + " ₽",
        scenarios: scen,
        explainer: isCS
          ? "Колл-спред — CALL с потолком выплаты. Страйк K фиксируется по уровню базового актива в день покупки (100%), рост засчитывается до K₂ = " + S.fmtSmart(K2) + "%: максимальная выплата — " + S.fmtSmart(capPct) + "% номинала. За счёт ограничения премия ниже, чем у обычного CALL. Если актив не вырос — выплаты нет, потеря ограничена премией."
          : "CALL-варрант — право на выплату при росте базового актива выше страйка. " + strikeTxt + " Если на экспирацию актив выше страйка, выплата растёт вместе с ним. Если нет — выплаты нет, потеря ограничена премией.",
        facts: [
          ["Стиль", "Европейский — выплата на дату экспирации"],
          ["Максимальный убыток", "Уплаченная премия"]
        ]
      };
    }
    if (inst.type === "discount") {
      const buyRub = nom * inst.quote / 100;
      return {
        badge: "ДИСКОНТНАЯ ОБЛИГАЦИЯ",
        subtitle: "Покупка дешевле номинала, погашение по 100% — доход зафиксирован в день сделки",
        payoff: () => chartPayoff(inst),
        payoffCaption: "Покупка дешевле номинала, погашение по 100%. Доход — разница, зафиксированная в момент покупки.",
        metrics: [
          [inst.tenor || "—", "срок"],
          ["100%", "выплата на погашение"],
          [S.fmt2(inst.quote) + "% ном.", "цена входа"],
          [inst.underlying, "базовый актив"]
        ],
        exampleIntro: "Номинал " + S.fmtInt(nom) + " ₽ · покупка по " + S.fmt2(inst.quote) + "% = " + S.fmtInt(buyRub) + " ₽",
        scenarios: [
          ["Дождались погашения " + inst.expiry, "Выплата " + S.fmtInt(nom) + " ₽ — 100% номинала", "+" + S.fmtInt(nom - buyRub) + " ₽", "var(--up)"],
          ["Продали раньше срока", "По текущей рыночной цене", "по рынку", "rgba(255,255,255,0.60)"]
        ],
        explainer: (inst.about ? inst.about + " " : "") + "Облигация покупается дешевле номинала — сегодня по " + S.fmt2(inst.quote) + "% от него. На дату погашения выплачивается полный номинал (если по контрольному лицу не наступит кредитное событие). Весь доход — дисконт: разница между ценой покупки и номиналом, известная в день сделки. Купонов нет.",
        facts: [
          ["Купоны", "Нет — весь доход в дисконте"],
          ["Риск", "Кредитное качество эмитента"]
        ]
      };
    }
    if (inst.type === "autocall") {
      const cpnPa = inst.couponPa != null ? inst.couponPa : inst.quote;
      const prot = inst.protectionPct || 65, cpnB = inst.couponBarrier || prot, call = inst.callBarrier || 120;
      const per = inst.obsPerYear || 4, nonCall = inst.nonCall || 0;
      const cpnPer = cpnPa / per;                        // купон за период, % номинала
      const cpnRub = nom * cpnPer / 100;
      const firstCall = nonCall + 1;                     // номер первого наблюдения с возможностью отзыва
      const yrs = parseFloat(String(inst.tenor).replace(",", ".")) || 3;
      const holdRub = nom * (1 + cpnPa / 100 * yrs);     // номинал + купоны за весь срок
      const downLvl = Math.max(10, prot - 20);           // сценарий «ниже барьера»
      const downRub = nom * downLvl / 100;
      return {
        badge: "АВТОКОЛЛ · WORST-OF",
        subtitle: "Условный купон на корзину " + inst.underlying + " — купон идёт, пока худшая бумага выше " + S.fmtSmart(cpnB) + "%",
        payoff: () => chartPayoff(inst),
        payoffCaption: "Возврат номинала на погашении в % от него; по горизонтали — уровень худшей бумаги корзины в % от начального. Купоны на графике не показаны — они начисляются отдельно на датах наблюдения.",
        metrics: [
          [S.fmt2(cpnPa) + "% г.", "купон · индикативно"],
          [S.fmtSmart(cpnB) + "%", "купонный барьер"],
          [S.fmtSmart(call) + "%", "барьер автоотзыва"],
          [S.fmtSmart(prot) + "%", "защита на погашении"],
          [inst.tenor, "срок"],
          [S.ccyLabel(inst), "валюта"]
        ],
        exampleIntro: "Номинал " + S.fmtInt(nom) + " ₽ · купон " + S.fmt2(cpnPa) + "% годовых = " + S.fmtInt(cpnRub) + " ₽ за период (" + (per === 4 ? "квартал" : "период") + ")",
        scenarios: [
          ["Автоотзыв: все бумаги выше " + S.fmtSmart(call) + "%", "Досрочное погашение — номинал и купон", "+" + S.fmtInt(cpnRub) + " ₽ за период", "var(--up)"],
          ["Корзина держится выше " + S.fmtSmart(cpnB) + "% весь срок", "Купоны за " + inst.tenor + " и номинал: " + S.fmtInt(holdRub) + " ₽", "+" + S.fmtInt(holdRub - nom) + " ₽", "var(--up)"],
          ["Худшая бумага ниже " + S.fmtSmart(cpnB) + "% на дату наблюдения", "Купон за этот период не выплачивается", "0 ₽", "rgba(255,255,255,0.60)"],
          ["На погашении худшая бумага на " + downLvl + "%", "Выплата по перформансу: " + S.fmtInt(downRub) + " ₽", "−" + S.fmtInt(nom - downRub) + " ₽", "var(--loss)"]
        ],
        explainer: "Автоколл — облигация с условным купоном на корзину из " + (inst.basket ? inst.basket.length : 3) + " акций по принципу worst-of: все условия считаются по худшей бумаге корзины. " +
          "На каждую дату наблюдения (" + (per === 4 ? "ежеквартально" : per + " раза в год") + ") проверяются два уровня. Если худшая бумага не ниже " + S.fmtSmart(cpnB) + "% начального уровня — начисляется купон " + S.fmt2(cpnPer) + "% номинала за период (" + S.fmt2(cpnPa) + "% годовых). " +
          "Если все бумаги не ниже " + S.fmtSmart(call) + "% — выпуск гасится досрочно: инвестор получает номинал и купон, сделка закрывается." +
          (nonCall ? " " + S.nonCallText(nonCall) + " досрочный отзыв невозможен — купоны идут минимум до " + firstCall + "-й даты наблюдения." : "") +
          " На погашении номинал возвращается полностью, пока худшая бумага не ниже " + S.fmtSmart(prot) + "%; ниже этого уровня выплата считается по её перформансу." +
          (inst.settle && inst.settle !== inst.currency ? " Экономика продукта считается в " + inst.currency + ", денежные расчёты идут в рублях." : ""),
        facts: [
          ["Принцип", "Worst-of — по худшей бумаге корзины"],
          ["Наблюдения", per === 4 ? "Ежеквартально" : per + " раза в год"],
          ["Non-call", nonCall ? S.nonCallText(nonCall).replace("Первый период", "1 период").replace("Первые ", "") + " без досрочного отзыва" : "Отзыв возможен с первой даты"],
          ["Максимальный убыток", "До полной суммы вложения при падении корзины"]
        ]
      };
    }
    if (inst.type === "booster") {
      const K = inst.strike || 100, K2 = inst.strike2 || 110, ku = (inst.ku || 175) / 100;
      const capPay = K + ku * (K2 - K), maxUp = capPay - 100, kuS = Math.round(ku * 100) + "%";
      const bandUp = S.fmtSmart(K2 - 100);           // рост актива до потолка, %
      const upFull = nom * capPay / 100;              // выплата при росте ≥ верхней границы
      const up5 = nom * (100 + ku * 5) / 100;         // рост актива на 5%
      const downRub = nom * 0.8;                      // падение на 20% → 80% номинала
      return {
        badge: "БУСТЕР · УСИЛЕННЫЙ РОСТ",
        subtitle: "Рост " + inst.underlying + " ×" + kuS + " до потолка · участие в падении 1:1",
        payoff: () => chartPayoff(inst),
        payoffCaption: "Слева от старта — падение 1:1; справа — рост ×" + kuS + " внутри диапазона " + S.fmtSmart(K) + "–" + S.fmtSmart(K2) + "% до потолка +" + S.fmt1(maxUp) + "%.",
        metrics: [
          [kuS, "коэффициент участия"],
          [S.fmtSmart(K) + "–" + S.fmtSmart(K2) + "%", "диапазон роста"],
          ["+" + S.fmt1(maxUp) + "%", "макс. выплата"],
          [inst.tenor || "—", "срок"]
        ],
        exampleIntro: "Вход по номиналу " + S.fmtInt(nom) + " ₽ (100%) · базовый актив " + inst.underlying,
        scenarios: [
          [inst.underlying + " вырос на " + bandUp + "% и выше", "Выплата " + S.fmtInt(upFull) + " ₽ — потолок", "+" + S.fmtInt(upFull - nom) + " ₽", "var(--up)"],
          [inst.underlying + " вырос на 5%", "Выплата " + S.fmtInt(up5) + " ₽ (рост ×" + kuS + ")", "+" + S.fmtInt(up5 - nom) + " ₽", "var(--up)"],
          [inst.underlying + " упал на 20%", "Выплата " + S.fmtInt(downRub) + " ₽ — падение 1:1", "−" + S.fmtInt(nom - downRub) + " ₽", "var(--loss)"]
        ],
        explainer: "Бустер даёт усиленное участие в росте базового актива: рост внутри диапазона " + S.fmtSmart(K) + "–" + S.fmtSmart(K2) + "% засчитывается с коэффициентом " + kuS + " — например, при росте актива на " + bandUp + "% выплата достигает максимума +" + S.fmt1(maxUp) + "% к номиналу. Выше диапазона выплата не растёт (потолок). Если актив падает, инвестор участвует в падении один к одному, как если бы держал сам актив. Купонов нет; результат определяется на дату погашения.",
        facts: [
          ["Купоны", "Нет — весь результат в выплате на погашение"],
          ["Риск", "Полное участие в падении базового актива"]
        ]
      };
    }
    const entryRub = nom * inst.quote / 100;
    const protK = inst.strike || 100;                       // страйк опциона, % от начального уровня
    const protOff = protK - 100;                            // с какого роста включается участие
    const upPct = protOff + 20;                             // сценарий: рост на 20 п.п. выше страйка
    const payoutUp = nom * S.calc.pct(inst, upPct) / 100;   // через calc.pct — он учитывает страйк
    const partS = Math.round(inst.participation * 100) + "%";
    return {
      badge: "ОБЛИГАЦИЯ · ЗАЩИТА КАПИТАЛА",
      subtitle: "Облигация с защитой капитала: " + inst.underlying + " · 100% номинала при любом сценарии" +
        (protOff > 0 ? " · участие с роста +" + S.fmtSmart(protOff) + "%" : ""),
      payoff: () => chartPayoff(inst),
      payoffCaption: "Выплата на экспирацию в % от номинала: не ниже 100% при любом сценарии, выше " +
        (protOff > 0 ? "страйка " + S.fmtSmart(protK) + "%" : "S₀") + " — участие в росте.",
      metrics: [
        [S.fmtSmart(inst.protectionPct != null ? inst.protectionPct : 100) + "%", "защита капитала"],
        [partS, "участие в росте"],
        [S.fmtSmart(protK) + "%", "страйк опциона"],
        [inst.tenor, "срок"],
        [S.ccyLabel(inst), "валюта"],
        [inst.underlying, "базовый актив"]
      ],
      exampleIntro: "Номинал " + S.fmtInt(nom) + " ₽ · вход по " + S.fmt2(inst.quote) + "% = " + S.fmtInt(entryRub) + " ₽",
      scenarios: [
        [inst.underlying + " вырос на " + S.fmtSmart(upPct) + "%", "Выплата " + S.fmtInt(payoutUp) + " ₽ — 100% + участие", "+" + S.fmtInt(payoutUp - entryRub) + " ₽", "var(--up)"],
        [inst.underlying + " упал на 15%", "Сработала защита: выплата " + S.fmtInt(nom) + " ₽", "0 ₽", "rgba(255,255,255,0.60)"]
      ],
      explainer: "Облигация возвращает 100% номинала при любом сценарии — рыночного убытка нет. " +
        (protOff > 0
          ? "Сверху выплачивается " + partS + " роста базового актива, который он покажет ВЫШЕ страйка " + S.fmtSmart(protK) + "% начального уровня: первые " + S.fmtSmart(protOff) + "% роста в выплату не идут."
          : "Если базовый актив на дату погашения выше начального уровня S₀, дополнительно выплачивается " + partS + " его роста.") +
        " Если актив упал — вы получаете номинал целиком. Купонов нет; результат определяется на дату погашения.",
      facts: [
        ["Стиль", "Европейский — выплата на дату экспирации"],
        ["Риск", "Кредитный риск эмитента облигации"]
      ]
    };
  }

  // ── Калькулятор выплаты (интерактивный «прикинь на клиента») ──
  // Математика калькулятора — в data/lib.js (S.calc), общая с карточкой инструмента.
  function calcHTML(inst) {
    // Бустер покупается по номиналу (100%), а не по quote (там хранится КУ) — вход = minNom.
    const atPar = inst.type === "booster" || inst.type === "autocall";   // покупка по номиналу, не по премии
    const price0 = atPar ? inst.minNom : Math.round(inst.minNom * inst.quote / 100), cfg = S.calc.move(inst);
    const slider = cfg ? '<div class="calc-row"><label class="calc-l">' + inst.underlying + ': <b id="calc-mv"></b></label>' +
      '<input class="calc-range" id="calc-move" type="range" min="' + cfg.min + '" max="' + cfg.max + '" value="' + cfg.val + '" step="1" aria-label="Сценарий по базовому активу"></div>' : '';
    return '<div class="sec"><div class="h">Калькулятор выплаты</div>' +
      '<div class="calc">' +
        '<div class="calc-row"><label class="calc-l" for="calc-amt">Сумма вложения, ₽</label>' +
          '<input class="calc-input" id="calc-amt" type="number" inputmode="numeric" min="0" max="1000000000" step="1000" value="' + price0 + '"></div>' +
        slider +
        '<div class="calc-out"><div class="calc-o"><div class="v" id="calc-payout"></div><div class="k">выплата при погашении</div></div>' +
          '<div class="calc-o"><div class="v" id="calc-net"></div><div class="k">результат</div></div></div>' +
        '<div class="calc-note" id="calc-note"></div>' +
      '</div></div>';
  }
  function wireCalc(inst) {
    const amt = document.getElementById("calc-amt"); if (!amt) return;
    const move = document.getElementById("calc-move"), mvOut = document.getElementById("calc-mv");
    const payoutEl = document.getElementById("calc-payout"), netEl = document.getElementById("calc-net"), noteEl = document.getElementById("calc-note");
    const prot = inst.protectionPct || 100;
    const MAX_AMT = 1e9;
    function run() {
      // Клемп суммы: отрицательное → 0, свыше 1 млрд → 1 млрд, мусор/экспонента → 0.
      const raw = parseFloat(amt.value);
      let amount = raw, clampNote = "";
      if (!isFinite(amount) || amount < 0) { amount = 0; if (raw < 0) clampNote = "Сумма не может быть отрицательной. "; }
      else if (amount > MAX_AMT) { amount = MAX_AMT; clampNote = "Максимум для расчёта — 1 млрд ₽. "; }
      // Бустер: вход по номиналу → номинал = сумме вложения. Иначе номинал = сумма / цена входа.
      const nominal = (inst.type === "booster" || inst.type === "autocall") ? amount : (inst.quote ? amount * 100 / inst.quote : 0);
      const m = move ? +move.value : 0;
      if (mvOut) mvOut.textContent = (m >= 0 ? "+" : "") + m + "%";
      const payout = nominal * S.calc.pct(inst, m) / 100, net = payout - amount;
      payoutEl.textContent = S.fmtInt(Math.round(payout)) + " ₽";
      netEl.textContent = (net >= 0 ? "+" : "−") + S.fmtInt(Math.round(Math.abs(net))) + " ₽";
      netEl.style.color = net >= 0 ? "var(--up)" : "var(--loss)";
      const be = S.calc.breakeven(inst);
      if (inst.type === "warrant") noteEl.textContent = clampNote + "Экспозиция на номинал " + S.fmtInt(Math.round(nominal)) + " ₽ за премию = сумму вложения. Безубыток — при росте " + inst.underlying + " примерно на +" + S.fmtSmart(be) + "%; ниже — выплата не покрывает премию.";
      else if (inst.type === "protection") noteEl.textContent = clampNote + "Номинал " + S.fmtInt(Math.round(nominal)) + " ₽. Защита " + prot + "%: при падении возвращается " + prot + "% номинала.";
      else if (inst.type === "booster") noteEl.textContent = clampNote + "Вложение = номинал " + S.fmtInt(Math.round(nominal)) + " ₽. Рост ×КУ внутри диапазона до потолка; при падении — участие 1:1, как в самом активе.";
      else if (inst.type === "autocall") noteEl.textContent = clampNote + "Вложение = номинал " + S.fmtInt(Math.round(nominal)) + " ₽. Показан возврат ТЕЛА на погашении по худшей бумаге корзины — БЕЗ купонов: они начисляются отдельно на датах наблюдения. Выше " + S.fmtSmart(inst.protectionPct || 65) + "% возвращается весь номинал.";
      else noteEl.textContent = clampNote + "Номинал " + S.fmtInt(Math.round(nominal)) + " ₽. При погашении — 100% номинала (если нет кредитного события). Доход зафиксирован дисконтом.";
    }
    amt.addEventListener("input", run);
    if (move) move.addEventListener("input", run);
    run();
  }

  // ─── Сравнение продуктов ──────────────────────────────────────────────────
  // Математика — из той же S.calc, что и калькулятор карточки: сравнение не может
  // разойтись с паспортом продукта. Ключевая нормировка: у продуктов разная цена
  // входа (варрант 15%, бустер 100%, дисконт 68% номинала), поэтому «выплата в %
  // номинала» несравнима. Приводим всё к РЕЗУЛЬТАТУ НА ВЛОЖЕННУЮ СУММУ.
  const CMP_MAX = 3;
  const CMP_COLORS = ["#EE7D1B", "#4F86E6", "#55C08A"];
  let cmpMode = false, cmp = [];

  // Цена входа в % номинала. Бустер покупается по номиналу (в quote у него КУ).
  function cmpEntry(r) { return (r.type === "booster" || r.type === "autocall") ? 100 : (r.quote || 0); }
  // Результат на вложенную сумму (%) при ходе базового актива move (%).
  function cmpResult(r, move) {
    const e = cmpEntry(r);
    if (!e) return 0;
    return S.calc.pct(r, move) / e * 100 - 100;
  }

  function cmpTypeLabel(r) {
    if (r.type === "warrant") return r.structure === "cs" ? "Варрант · колл-спред" : "Варрант · CALL";
    if (r.type === "discount") return "Дисконтная облигация";
    if (r.type === "booster") return "Бустер";
    if (r.type === "protection") return "Облигация с защитой капитала";
    if (r.type === "autocall") return "Автоколл · worst-of";
    return "Структурный продукт";
  }
  function cmpGrowth(r) {
    if (r.type === "warrant") return r.structure === "cs"
      ? "1:1 в диапазоне " + S.fmtSmart(r.strike) + "–" + S.fmtSmart(r.strike2) + "%"
      : "1:1 выше " + S.fmtSmart(r.strike) + "%";
    if (r.type === "booster") return "×" + Math.round(r.ku || r.quote) + "% в диапазоне " +
      S.fmtSmart(r.strike || 100) + "–" + S.fmtSmart(r.strike2 || 110) + "%";
    if (r.type === "protection") return "участие " + Math.round((r.participation || 1) * 100) + "%";
    if (r.type === "autocall") return "купон " + S.fmt2(r.couponPa != null ? r.couponPa : r.quote) + "% г. вместо роста";
    return "—";
  }
  function cmpCap(r) {
    if (r.type === "warrant") return r.structure === "cs"
      ? "+" + S.fmtSmart((r.strike2 || 150) - (r.strike || 100)) + "% ном." : "не ограничен";
    if (r.type === "booster") {
      const K = r.strike || 100, K2 = r.strike2 || 110, ku = (r.ku || r.quote || 100) / 100;
      return "+" + S.fmtSmart((K2 - K) * ku) + "% ном.";
    }
    if (r.type === "discount") return "100% ном. — фиксировано";
    if (r.type === "protection") return r.cap != null ? "участие до +" + S.fmtSmart(r.cap) + "% актива" : "не ограничен";
    if (r.type === "autocall") return "номинал + накопленные купоны";
    return "—";
  }
  function cmpDown(r) {
    if (r.type === "warrant") return "только премия — " + S.fmt2(r.quote) + "% ном.";
    if (r.type === "booster") return "1:1 вместе с активом";
    if (r.type === "discount") return "не зависит от рынка · кредитный риск";
    if (r.type === "protection") return "защита " + (r.protectionPct || 100) + "% ном.";
    if (r.type === "autocall") return "защита " + S.fmtSmart(r.protectionPct || 65) + "% ном., ниже — по перформансу";
    return "—";
  }
  function cmpBE(r) {
    const be = S.calc.breakeven(r);
    if (be != null) return "рост " + (be >= 0 ? "+" : "−") + S.fmtSmart(Math.abs(be)) + "%";
    if (r.type === "booster") return "на месте — 0%";
    if (r.type === "discount") return "известен в день сделки";
    if (r.type === "autocall") return "worst-of выше " + S.fmtSmart(r.protectionPct || 65) + "%";
    return "—";
  }

  const CMP_ROWS = [
    ["Тип", cmpTypeLabel],
    ["Базовый актив", r => r.underlying || "—"],
    ["Класс актива", r => r.cls || "—"],
    ["Срок", r => r.tenor || "—"],
    ["Цена входа", r => '<span class="mono">' + S.fmt2(cmpEntry(r)) + "%</span> ном." +
      (r.type === "booster" ? "" : " · индикативно")],
    ["Участие в росте", cmpGrowth],
    ["Потолок выплаты", cmpCap],
    ["Риск снижения", cmpDown],
    ["Безубыток", cmpBE],
    ["Мин. номинал", r => '<span class="mono">' + S.fmtInt(r.minNom || 0) + "</span> ₽"]
  ];

  // Наложенные профили: X — ход базового актива, Y — результат на вложенную сумму.
  function cmpChartSVG(items) {
    const W = 560, H = 240, PADL = 46, PADR = 14, PADT = 14, PADB = 30;
    const MOVE_MIN = -30, MOVE_MAX = 60, STEP = 2;
    const series = items.map((r, i) => {
      const pts = [];
      for (let m = MOVE_MIN; m <= MOVE_MAX; m += STEP) pts.push([m, cmpResult(r, m)]);
      return { r, color: CMP_COLORS[i % CMP_COLORS.length], pts };
    });
    let lo = 0, hi = 0;   // 0 всегда в диапазоне — это точка «вернул вложенное»
    series.forEach(s => s.pts.forEach(p => { if (p[1] < lo) lo = p[1]; if (p[1] > hi) hi = p[1]; }));
    // Округляем границы до «круглого» шага, иначе подписи оси выходят вида «+332%».
    const rawStep = (hi - lo) / 4;
    const pow = Math.pow(10, Math.floor(Math.log10(rawStep || 1)));
    const n = (rawStep || 1) / pow;
    const step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * pow;
    lo = Math.floor(lo / step) * step;
    hi = Math.ceil(hi / step) * step;
    const x = m => PADL + (m - MOVE_MIN) / (MOVE_MAX - MOVE_MIN) * (W - PADL - PADR);
    const y = v => H - PADB - (v - lo) / (hi - lo) * (H - PADT - PADB);
    const MONO = 'font-family="JetBrains Mono, monospace"';
    let grid = "";
    for (let val = lo; val <= hi + step / 2; val += step) {
      const gy = y(val);
      grid += '<line x1="' + PADL + '" y1="' + gy.toFixed(1) + '" x2="' + (W - PADR) + '" y2="' + gy.toFixed(1) +
        '" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>' +
        '<text x="' + (PADL - 7) + '" y="' + (gy + 4).toFixed(1) + '" text-anchor="end" fill="rgba(242,243,247,0.45)" font-size="10" ' + MONO + '>' +
        (val > 0 ? "+" : val < 0 ? "−" : "") + S.fmtSmart(Math.abs(val)) + '%</text>';
    }
    // нулевая линия результата и нулевой ход актива
    const zeroY = y(0), zeroX = x(0);
    const zeros = '<line x1="' + PADL + '" y1="' + zeroY.toFixed(1) + '" x2="' + (W - PADR) + '" y2="' + zeroY.toFixed(1) +
        '" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>' +
      '<line x1="' + zeroX.toFixed(1) + '" y1="' + PADT + '" x2="' + zeroX.toFixed(1) + '" y2="' + (H - PADB) +
        '" stroke="rgba(255,255,255,0.10)" stroke-width="1" stroke-dasharray="3 4"/>';
    let xlab = "";
    for (let m = MOVE_MIN; m <= MOVE_MAX; m += 15) {
      xlab += '<text x="' + x(m).toFixed(1) + '" y="' + (H - PADB + 17) + '" text-anchor="middle" fill="rgba(242,243,247,0.45)" font-size="10" ' + MONO + '>' +
        (m > 0 ? "+" : "") + m + '%</text>';
    }
    const lines = series.map(s =>
      '<path d="' + s.pts.map((p, i) => (i ? "L" : "M") + x(p[0]).toFixed(1) + "," + y(p[1]).toFixed(1)).join(" ") +
      '" fill="none" stroke="' + s.color + '" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>').join("");
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" style="display:block" role="img" ' +
      'aria-label="Профили результата на вложенную сумму для выбранных продуктов">' +
      grid + zeros + xlab + lines +
      '<text x="' + (PADL - 7) + '" y="12" text-anchor="end" fill="rgba(242,243,247,0.45)" font-size="10" ' + MONO + '>%</text>' +
      '</svg>';
  }

  function cmpHTML(items) {
    const cols = items.map((r, i) => {
      const sn = shortName(r);
      // у дисконтных короткое имя уже содержит актив — подзаголовок был бы дублем
      const sub = r.underlying && sn.indexOf(r.underlying) < 0 ? '<span class="tp">' + r.underlying + '</span>' : "";
      return '<th scope="col"><span style="color:' + CMP_COLORS[i % CMP_COLORS.length] + '">' + sn + '</span>' + sub + '</th>';
    }).join("");
    const rows = CMP_ROWS.map(([label, fn]) => {
      const vals = items.map(fn);
      const diff = vals.some(v => v !== vals[0]);
      return '<tr' + (diff ? ' class="diff"' : '') + '><th scope="row">' + label + '</th>' +
        vals.map(v => '<td>' + v + '</td>').join("") + '</tr>';
    }).join("");
    // В легенде и калькуляторе — полные названия: короткие («CALL 100 · 2 года»)
    // рассчитаны на список, где базовый актив вынесен в заголовок группы.
    const legend = items.map((r, i) =>
      '<span class="lg"><span class="sw" style="background:' + CMP_COLORS[i % CMP_COLORS.length] + '"></span>' +
      S.displayName(r) + '</span>').join("");
    return '<div class="cmp-head"><div class="cmp-h1">Сравнение · ' + items.length + ' продукта</div>' +
        '<span class="sh-host" id="cmp-sh-host"></span></div>' +
      '<div class="cmp-scroll"><table class="cmp-tbl"><thead><tr><th scope="col">Параметр</th>' + cols + '</tr></thead>' +
        '<tbody>' + rows + '</tbody></table></div>' +
      '<div class="cmp-diffnote">Подсвечены строки, где продукты различаются.</div>' +
      '<div class="sec" style="margin-top:18px"><div class="h">Профиль результата</div>' +
        '<div class="chart-box">' + cmpChartSVG(items) + '</div>' +
        '<div class="cmp-legend">' + legend + '</div>' +
        '<div class="calc-note">По вертикали — результат на вложенную сумму, по горизонтали — изменение базового актива продукта. ' +
          'Приведено к вложенной сумме, потому что цена входа у продуктов разная.</div>' +
      '</div>' +
      '<div class="sec"><div class="h">Общий калькулятор</div><div class="calc">' +
        '<div class="calc-row"><label class="calc-l" for="cmp-amt">Сумма вложения в каждый, ₽</label>' +
          '<input class="calc-input" id="cmp-amt" type="number" inputmode="numeric" min="0" max="1000000000" step="1000" value="1000000"></div>' +
        '<div class="calc-row"><label class="calc-l">Базовый актив каждого продукта: <b id="cmp-mv"></b></label>' +
          '<input class="calc-range" id="cmp-move" type="range" min="-30" max="60" value="20" step="1" aria-label="Сценарий по базовому активу"></div>' +
        '<div class="cmp-res" id="cmp-res"></div>' +
        '<div class="calc-note">Сценарий применяется к базовому активу <b>каждого</b> продукта отдельно — это не единое движение рынка. ' +
          'У дисконтных облигаций выплата от рынка не зависит.</div>' +
      '</div></div>';
  }

  function wireCmpCalc(items) {
    const amt = document.getElementById("cmp-amt"); if (!amt) return;
    const move = document.getElementById("cmp-move"), mvOut = document.getElementById("cmp-mv"),
          out = document.getElementById("cmp-res");
    const MAX_AMT = 1e9;
    function run() {
      const raw = parseFloat(amt.value);
      let amount = raw;
      if (!isFinite(amount) || amount < 0) amount = 0;
      else if (amount > MAX_AMT) amount = MAX_AMT;
      const m = +move.value;
      mvOut.textContent = (m >= 0 ? "+" : "") + m + "%";
      out.innerHTML = items.map((r, i) => {
        const e = cmpEntry(r);
        const nominal = e ? amount * 100 / e : 0;
        const payout = nominal * S.calc.pct(r, m) / 100, net = payout - amount;
        return '<div class="cmp-r"><span class="nm"><span class="sw" style="background:' +
            CMP_COLORS[i % CMP_COLORS.length] + '"></span>' + S.displayName(r) + '</span>' +
          '<span class="vals"><span class="pay">выплата ' + S.fmtInt(Math.round(payout)) + ' ₽</span>' +
          '<span class="net" style="color:' + (net >= 0 ? "var(--up)" : "var(--loss)") + '">' +
            (net >= 0 ? "+" : "−") + S.fmtInt(Math.round(Math.abs(net))) + ' ₽</span></span></div>';
      }).join("");
    }
    amt.addEventListener("input", run);
    move.addEventListener("input", run);
    run();
  }

  function cmpUrl() {
    const u = new URL("board.html", location.href);
    u.searchParams.set("cmp", cmp.join(","));
    return u.href;
  }

  function renderCompare() {
    const items = cmp.map(id => S.INSTRUMENTS.find(r => r.id === id)).filter(Boolean);
    if (items.length < 2) return;
    document.getElementById("panel").innerHTML = cmpHTML(items);
    wireCmpCalc(items);
    const host = document.getElementById("cmp-sh-host");
    if (host && window.Share) {
      Share.attach(host, {
        url: cmpUrl(), title: "Сравнение продуктов Rumberg",
        name: items.map(shortName).join(" vs "),
        pitch: "Сравнение параметров и профиля результата",
        params: items.map(r => [shortName(r), S.fmt2(cmpEntry(r)) + "% ном."])
      });
    }
    const srl = document.getElementById("sr-live");
    if (srl) srl.textContent = "Сравнение: " + items.map(shortName).join(", ");
    if (window.matchMedia("(max-width: 900px)").matches) {
      document.getElementById("panel-wrap").classList.add("open");
    }
  }

  function cmpBarUpdate() {
    const bar = document.getElementById("cmp-bar");
    bar.classList.toggle("on", cmpMode);
    document.getElementById("cmp-cnt").textContent = "выбрано " + cmp.length + " из " + CMP_MAX;
    document.getElementById("cmp-hint").textContent =
      cmp.length < 2 ? "· отметьте ещё продукт" : "· сравнение справа";
  }

  function cmpToggleItem(id) {
    const i = cmp.indexOf(id);
    if (i >= 0) cmp.splice(i, 1);
    else {
      if (cmp.length >= CMP_MAX) return false;   // лимит — молча игнорируем
      cmp.push(id);
    }
    document.querySelectorAll(".item").forEach(el => {
      const on = cmp.indexOf(el.getAttribute("data-id")) >= 0;
      el.classList.toggle("picked", on);
      el.setAttribute("aria-pressed", on);
    });
    cmpBarUpdate();
    if (cmp.length >= 2) renderCompare();
    else document.getElementById("panel").innerHTML =
      '<div class="placeholder">Отметьте 2–3 продукта, чтобы сравнить их бок о бок</div>';
    return true;
  }

  function setCmpMode(on) {
    cmpMode = on;
    const chip = document.getElementById("cmp-chip");
    if (chip) { chip.classList.toggle("on", on); chip.setAttribute("aria-pressed", on); }
    document.getElementById("list").classList.toggle("cmp", on);
    if (!on) {
      cmp = [];
      document.querySelectorAll(".item").forEach(el => { el.classList.remove("picked"); el.removeAttribute("aria-pressed"); });
      document.getElementById("panel").innerHTML = selected
        ? '<div class="placeholder">Выберите инструмент из списка</div>'
        : '<div class="placeholder">Выберите инструмент из списка</div>';
      if (selected) select(selected);
    } else {
      document.getElementById("panel").innerHTML =
        '<div class="placeholder">Отметьте 2–3 продукта, чтобы сравнить их бок о бок</div>';
    }
    cmpBarUpdate();
  }

  function actionsHTML(inst) {
    return '<span class="ct-host" id="ct-host"></span><a class="btn-pdf btn-secondary" href="onepager.html?id=' + encodeURIComponent(inst.id) + '&print=1">' +
      '<svg width="13" height="13" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M7 1 V9 M7 9 L4 6 M7 9 L10 6" stroke="#0C0A08" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 12 H12" stroke="#0C0A08" stroke-width="1.6" stroke-linecap="round"/></svg>' +
      'Скачать one-pager (PDF)</a><span class="sh-host" id="sh-host"></span>';
  }

  function passportHTML(inst) {
    const c = buildContent(inst);
    const U = S.underlyingInfo(inst.underlying);
    return '<div class="pp-top"><div>' +
        '<div class="pp-title-row"><div class="pp-title">' + S.displayName(inst) + '</div>' +
          '<div class="pp-actions">' + actionsHTML(inst) + '</div></div>' +
        '<span class="badge">' + c.badge + '</span>' +
        '<div class="pp-sub">' + c.subtitle + '</div>' +
      '</div>' +
      '<div class="quote-block">' +
        '<div class="quote-big">' + S.quoteBig(inst.quote) + '</div>' +
        '<div class="quote-sub">' + (inst.type === "booster" ? "коэффициент участия · индикативно"
          : inst.type === "autocall" ? "купон · % годовых · индикативно"
          : "котировка · индикативно · % от номинала · " + (inst.currency || "RUB")) + '</div>' +
      '</div></div>' +
      '<div class="chart-box">' +
        '<div class="chart-head"><span class="chart-title" id="chart-title"></span>' +
        (U ? '<div class="tabs" role="tablist" aria-label="Вид графика"><button class="tab" id="tab-payoff" role="tab" type="button">Выплата</button><button class="tab" id="tab-under" role="tab" type="button">Базовый актив</button></div>' : '') +
        '</div><div id="chart"></div><div class="chart-caption" id="chart-caption"></div>' +
      '</div>' +
      '<div class="metrics">' + c.metrics.map(m => '<div class="metric"><div class="v">' + m[0] + '</div><div class="k">' + m[1] + '</div></div>').join("") + '</div>' +
      calcHTML(inst) +
      '<div class="sec"><div class="h">Пример расчёта</div><div class="intro">' + c.exampleIntro + '</div>' +
        c.scenarios.map(s => '<div class="scenario"><div class="l">' + s[0] + '</div><div class="d">' + s[1] + '</div><div class="r" style="color:' + s[3] + '">' + s[2] + '</div></div>').join("") +
        (S.isFxSensitive(inst.underlying) ? '<div style="margin-top:12px;padding:9px 13px;border-left:3px solid #EE7D1B;background:rgba(238,125,27,0.12);border-radius:0 7px 7px 0;font-size:12.5px;line-height:1.5;color:#E7B98D">' + S.LEGAL.fx + '</div>' : '') + '</div>' +
      '<div class="sec"><div class="h">Как устроен продукт</div><div class="explainer">' + c.explainer + '</div>' +
        '<div class="facts">' + c.facts.map(f => '<div class="fact"><div class="k">' + f[0] + '</div><div class="v">' + f[1] + '</div></div>').join("") + '</div></div>';
  }

  function setMode(m, inst, c, U) {
    mode = m;
    const tp = document.getElementById("tab-payoff"), tu = document.getElementById("tab-under");
    if (tp) { tp.className = "tab" + (m === "payoff" ? " active" : ""); tp.setAttribute("aria-selected", m === "payoff"); }
    if (tu) { tu.className = "tab" + (m === "under" ? " active" : ""); tu.setAttribute("aria-selected", m === "under"); }
    document.getElementById("chart-title").textContent = m === "payoff" ? "Диаграмма выплат" : "Базовый актив — " + inst.underlying;
    const cap = m === "payoff" ? c.payoffCaption : (U.desc + " Динамика за 12 месяцев; данные — демо.");
    document.getElementById("chart-caption").textContent = cap;
    // SVG-график без текстовой альтернативы (WCAG 1.1.1) → контейнер role=img + подпись из caption
    const chartEl = document.getElementById("chart");
    chartEl.innerHTML = m === "payoff" ? c.payoff() : chartUnderlying(inst, U);
    chartEl.setAttribute("role", "img");
    chartEl.setAttribute("aria-label", (m === "payoff" ? "Диаграмма выплат. " : "График базового актива. ") + cap);
  }

  function select(id, fromUser) {
    selected = id;
    const inst = S.INSTRUMENTS.find(r => r.id === id);
    if (!inst) return;
    const srl = document.getElementById("sr-live");
    if (srl) srl.textContent = "Выбран инструмент: " + S.displayName(inst);
    document.getElementById("panel").innerHTML = passportHTML(inst);
    const c = buildContent(inst), U = S.underlyingInfo(inst.underlying);
    const shHost = document.getElementById("sh-host");
    if (shHost && window.Share) {
      // ссылка на p/<id> — лёгкую страницу с персональным og-превью (Telegram/WhatsApp
      // покажут название продукта, а не общую обложку); она мгновенно ведёт на instrument.html.
      // Без .html: GitHub Pages отдаёт p/<id>.html и по короткому пути (проверено на боевом).
      const prodUrl = new URL("p/" + encodeURIComponent(inst.id), location.href).href;
      const params = (c.metrics || []).filter(m => m[1] !== "базовый актив").map(m => [m[1], m[0]]);
      Share.attach(shHost, { url: prodUrl, title: S.displayName(inst), name: S.displayName(inst), pitch: c.subtitle, params });
    }
    const ctHost = document.getElementById("ct-host");
    if (ctHost && window.Contact) {
      const cu = new URL("instrument.html?id=" + encodeURIComponent(inst.id), location.href).href;
      Contact.attach(ctHost, { title: S.displayName(inst), url: cu, id: inst.id });
    }
    wireCalc(inst);
    const tp = document.getElementById("tab-payoff"), tu = document.getElementById("tab-under");
    if (tp) tp.addEventListener("click", () => setMode("payoff", inst, c, U));
    if (tu) tu.addEventListener("click", () => setMode("under", inst, c, U));
    setMode("payoff", inst, c, U);
    document.querySelectorAll(".item").forEach(el =>
      el.classList.toggle("active", el.getAttribute("data-id") === id));
    history.replaceState(null, "", "#" + id);
    if (fromUser && window.matchMedia("(max-width: 900px)").matches) {
      document.getElementById("panel-wrap").classList.add("open");
    }
  }

  // Короткое имя в списке — без повторения базового актива (он в заголовке группы)
  function shortName(r) {
    if (r.type === "warrant") return (r.structure === "cs" ? "CS 100–150" : "CALL " + S.fmtSmart(r.strike)) + " · " + r.tenor;
    if (r.type === "discount") return (r.underlying || "Дисконтная облигация") + " · " + r.tenor;
    if (r.type === "booster") return "Бустер · " + r.tenor;
    if (r.type === "autocall") return "Автоколл · " + r.tenor;
    return "Участие " + Math.round(r.participation * 100) + "%" + (r.strike > 100 ? " · от +" + S.fmtSmart(r.strike - 100) + "%" : "") + " · " + r.tenor;
  }

  function filtered() {
    const needle = q.trim().toLowerCase();
    return S.INSTRUMENTS.filter(r =>
      (type === "all" || r.type === type) &&
      (!needle || (r.name + " " + r.id + " " + r.underlying).toLowerCase().includes(needle)));
  }

  function itemHTML(r) {
    var qv = r.type === "booster" ? "КУ " + Math.round(r.quote) + "%"
      : r.type === "autocall" ? S.fmt2(r.couponPa != null ? r.couponPa : r.quote) + "% г."
      : S.fmt2(r.quote) + "%";
    const picked = cmp.indexOf(r.id) >= 0;
    return '<button class="item' + (r.id === selected && !cmpMode ? " active" : "") + (picked ? " picked" : "") +
      '" data-id="' + r.id + '"' + (cmpMode ? ' aria-pressed="' + picked + '"' : "") + '>' +
      '<div class="r1"><span class="nm"><span class="ck"></span>' + shortName(r) + '</span><span class="q">' + qv + '</span></div>' +
    '</button>';
  }

  // Свёрнутая группа тоже должна нести цифру: «4 · 15,00–86,50%»
  function groupRange(items) {
    const vals = items.map(r => r.quote).filter(v => typeof v === "number");
    if (!vals.length) return "";
    const lo = Math.min(...vals), hi = Math.max(...vals);
    // У бустеров quote — коэффициент участия, а не цена: подписываем как в строке списка
    if (items.every(r => r.type === "booster")) {
      return "КУ " + (lo === hi ? Math.round(lo) + "%" : Math.round(lo) + "–" + Math.round(hi) + "%");
    }
    return lo === hi ? S.fmt2(lo) + "%" : S.fmt2(lo) + "–" + S.fmt2(hi) + "%";
  }

  function render() {
    const list = filtered();
    document.getElementById("count").textContent = "инструментов: " + list.length;

    const groups = new Map();
    list.forEach(r => {
      if (!groups.has(r.underlying)) groups.set(r.underlying, []);
      groups.get(r.underlying).push(r);
    });
    const sorted = [...groups.entries()].sort((a, b) => b[1].length - a[1].length || a[0].localeCompare(b[0], "ru"));
    const searching = q.trim().length > 0;

    document.getElementById("list").innerHTML = sorted.length ? sorted.map(([name, items], gi) => {
      const open = searching || !closedGroups.has(name);
      const meta = items.length + (open ? "" : " · " + groupRange(items));
      return '<button class="group-h' + (open ? " open" : "") + '" data-g="' + name.replace(/"/g, "&quot;") + '" aria-expanded="' + open + '">' +
          '<span class="chev">▶</span><span class="name">' + name + '</span><span class="gc">' + meta + '</span></button>' +
        '<div class="group-items' + (open ? " open" : "") + '">' + items.map(itemHTML).join("") + '</div>';
    }).join("") : '<div class="empty-list">Ничего не найдено — измените фильтр или запрос.</div>';

    document.querySelectorAll(".group-h").forEach(el => el.addEventListener("click", () => {
      const g = el.getAttribute("data-g");
      if (closedGroups.has(g)) closedGroups.delete(g); else closedGroups.add(g);
      render();
    }));

    // «Развернуть всё / Свернуть всё» — при поиске группы раскрыты принудительно
    const names = sorted.map(g => g[0]);
    const anyClosed = names.some(n => closedGroups.has(n));
    const ta = document.getElementById("toggle-all");
    ta.hidden = searching || sorted.length < 2;
    ta.textContent = anyClosed ? "Развернуть всё" : "Свернуть всё";
    ta.onclick = () => {
      if (anyClosed) names.forEach(n => closedGroups.delete(n));
      else names.forEach(n => closedGroups.add(n));
      render();
    };
    document.querySelectorAll(".item").forEach(el =>
      el.addEventListener("click", () => {
        const id = el.getAttribute("data-id");
        if (cmpMode) cmpToggleItem(id); else select(id, true);
      }));

    if (selected && !list.some(r => r.id === selected)) {
      selected = null;
      document.getElementById("panel").innerHTML = '<div class="placeholder">Выберите инструмент из списка</div>';
    }
  }

  // Фильтр по семейству
  const counts = { all: S.INSTRUMENTS.length };
  S.INSTRUMENTS.forEach(r => counts[r.type] = (counts[r.type] || 0) + 1);
  document.getElementById("kinds").innerHTML = ["all", "warrant", "discount", "autocall", "booster", "protection"].map(t =>
    '<button class="kf' + (t === type ? " active" : "") + '" data-k="' + t + '" aria-pressed="' + (t === type) + '">' +
    (t === "all" ? "Все" : TYPE_LABEL[t]) + '<span class="n">' + (counts[t] || 0) + '</span></button>').join("");
  document.querySelectorAll(".kf").forEach(b => b.addEventListener("click", () => {
    type = b.getAttribute("data-k");
    document.querySelectorAll(".kf").forEach(x => { const on = x === b; x.classList.toggle("active", on); x.setAttribute("aria-pressed", on); });
    render();
  }));

  // Чипс «Сравнить» — в том же ряду, что фильтры по типу
  document.getElementById("kinds").insertAdjacentHTML("beforeend",
    '<button class="cmp-chip" id="cmp-chip" type="button" aria-pressed="false" title="Сравнить 2–3 продукта">⇄ Сравнить</button>');
  document.getElementById("cmp-chip").addEventListener("click", () => setCmpMode(!cmpMode));
  document.getElementById("cmp-reset").addEventListener("click", () => setCmpMode(false));
  document.getElementById("search").addEventListener("input", e => { q = e.target.value; render(); });
  document.getElementById("panel-close").addEventListener("click", () =>
    document.getElementById("panel-wrap").classList.remove("open"));

  // Deep-link: #id инструмента → открыть его группу
  const hash = decodeURIComponent(location.hash.slice(1));
  if (hash) {
    const r = S.INSTRUMENTS.find(x => x.id === hash);
    if (r) { selected = hash; closedGroups.delete(r.underlying); if (type !== "all" && r.type !== type) type = "all"; }
  }
  // Deep-link на сравнение: ?cmp=ID1,ID2[,ID3] — сейлз отправляет клиенту готовое
  // сравнение одной ссылкой. Неизвестные id молча отбрасываем (продукт мог быть снят).
  const cmpParam = new URLSearchParams(location.search).get("cmp");
  if (cmpParam) {
    const ids = cmpParam.split(",").map(s => s.trim())
      .filter((id, i, a) => a.indexOf(id) === i)          // без дублей: ?cmp=A,A дал бы две одинаковые колонки
      .filter(id => S.INSTRUMENTS.some(r => r.id === id)).slice(0, CMP_MAX);
    if (ids.length >= 2) {
      cmp = ids;
      cmpMode = true;
      type = "all";                                   // чтобы отмеченные продукты были видны в списке
      ids.forEach(id => {
        const r = S.INSTRUMENTS.find(x => x.id === id);
        if (r) closedGroups.delete(r.underlying);
      });
      const chip = document.getElementById("cmp-chip");
      if (chip) { chip.classList.add("on"); chip.setAttribute("aria-pressed", "true"); }
      document.getElementById("list").classList.add("cmp");
      document.querySelectorAll(".kf").forEach(x => {
        const on = x.getAttribute("data-k") === "all";
        x.classList.toggle("active", on); x.setAttribute("aria-pressed", on);
      });
    }
  }

  render();
  if (cmp.length >= 2) { cmpBarUpdate(); renderCompare(); }
  // Deep-link по #id — явное намерение открыть инструмент: на мобиле раскрываем
  // полноэкранный паспорт (fromUser=true), иначе видна вся доска вместо продукта.
  else if (selected) select(selected, !!hash);

  // ── Полоса под шапкой: синусоида-фон + лента мотивирующих фраз (декор) ──
  (function ribbon() {
    // Убраны: «Доходность любит расчёт» (доходность как метрика — под запретом
    // правил витрины) и «Капитал под защитой при любом сценарии» (защиты капитала
    // среди реальных продуктов нет, все могут потерять деньги — вводит в заблуждение).
    var PHRASES = [
      "Риск известен до сделки",
      "Доход по формуле, а не по удаче",
      "Идея = гипотеза + цифры",
      "Защита или рычаг — под вашу цель",
      "Считай сценарий до сделки — прямо здесь",
      "Каждая идея — с примером в рублях",
      "Рычаг на рост — риск лишь в премии",
      "Рынок вознаграждает подготовленных"
    ];
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    // лента фраз
    var rot = document.getElementById("tk-rot");
    if (rot) {
      PHRASES.forEach(function (p, i) { var s = document.createElement("span"); s.textContent = p; if (i === 0) s.className = "on"; rot.appendChild(s); });
      if (!reduce && PHRASES.length > 1) {
        var k = 0, spans = rot.querySelectorAll("span"), timer = null;
        // setInterval с clearInterval: в фоновой вкладке ротацию гасим, чтобы
        // таймер не тикал вхолостую, и возобновляем при возврате на вкладку.
        function startRot() { if (timer) return; timer = setInterval(function () { spans[k].classList.remove("on"); k = (k + 1) % spans.length; spans[k].classList.add("on"); }, 3600); }
        function stopRot() { if (timer) { clearInterval(timer); timer = null; } }
        startRot();
        document.addEventListener("visibilitychange", function () { document.hidden ? stopRot() : startRot(); });
      }
    }

    // синусоида на фоне (приглушённая, тихо дрейфует)
    var svg = document.getElementById("tk-sine");
    if (!svg) return;
    var NS = "http://www.w3.org/2000/svg", path = document.createElementNS(NS, "path");
    path.setAttribute("fill", "none"); path.setAttribute("stroke", "rgba(238,125,27,0.30)"); path.setAttribute("stroke-width", "1.6"); path.setAttribute("stroke-linecap", "round");
    svg.appendChild(path);
    var W = 1000, H = 54, phase = 0;
    function size() { W = svg.clientWidth || 1000; svg.setAttribute("viewBox", "0 0 " + W + " " + H); }
    function draw() {
      var cy = H / 2, amp = 13, cycles = 3, d = "", x;
      for (x = 0; x <= W; x += 6) d += (x === 0 ? "M" : "L") + x.toFixed(1) + " " + (cy + Math.sin(x / W * cycles * 6.2832 + phase) * amp).toFixed(1) + " ";
      path.setAttribute("d", d);
    }
    size(); draw();
    var rw = 0;
    window.addEventListener("resize", function () { clearTimeout(rw); rw = setTimeout(function () { size(); draw(); }, 150); });
    if (reduce) return;
    (function fr() { phase -= 0.018; draw(); requestAnimationFrame(fr); })();
  })();
</script>
